title = "Analyser un projet crypto"
summary = "Sept leçons pour regarder un jeton au-delà de son prix : capitalisation et valorisation totalement diluée, calendrier d'émission et déblocages, revenus réels et incitations, prêts et liquidations, pools et perte impermanente, risques propres à la DeFi, puis une grille d'analyse à appliquer à n'importe quel projet."
