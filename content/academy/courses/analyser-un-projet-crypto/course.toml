status = "published"
version = 1
objectives = [
  "Calculer la capitalisation, la valorisation totalement diluée et l'effet d'un déblocage de jetons.",
  "Distinguer les revenus réels d'un protocole des incitations qu'il distribue.",
  "Calculer le facteur de santé et le prix de liquidation d'un prêt, et la perte impermanente d'une position de liquidité.",
  "Appliquer une grille d'analyse et reconnaître les signaux d'alerte d'un projet.",
]
prerequisites = ["Utiliser la crypto en sécurité"]
