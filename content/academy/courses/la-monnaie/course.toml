[[module]]
id = "creation"
title = "Qui crée la monnaie"
summary = "Les banques quand elles prêtent, la banque centrale qui fixe le prix de l'argent, et ce que coûte un crédit."
lessons = ["monnaie-bancaire", "banque-centrale", "taux-interet"]

[[module]]
id = "dette"
title = "Dette et politique monétaire"
summary = "La dette publique et les obligations, puis ce que peut et ne peut pas faire la politique monétaire."
