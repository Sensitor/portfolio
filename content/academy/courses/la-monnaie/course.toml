id = "la-monnaie"
path = "monnaie-inflation"
title = "La monnaie"
summary = "Neuf leçons pour comprendre ce qu'est la monnaie et d'où elle vient : ses fonctions et son histoire, la monnaie créée par les banques quand elles prêtent, le rôle de la banque centrale et des taux d'intérêt, la dette publique et les obligations, la politique monétaire et ses limites, puis la différence entre monnaie, liquidité et richesse."
level = "debutant"
status = "published"
version = 1
objectives = [
  "Distinguer les fonctions de la monnaie et dire lesquelles une monnaie remplit bien ou mal.",
  "Expliquer comment un crédit bancaire crée de la monnaie, bilan à l'appui.",
  "Décrire comment une banque centrale agit sur les taux et pourquoi ses effets sont lents.",
  "Relier taux d'intérêt, coût d'un crédit et prix des obligations, chiffres à l'appui.",
  "Séparer les mécanismes documentés de la politique monétaire des débats qui les entourent.",
]
prerequisites = []
final_quiz = "monnaie-validation"

