[[dataset]]
id = "rattrapage-attaquant"
title = "Probabilité qu'un attaquant rattrape la chaîne honnête, selon le nombre de confirmations"
kind = "computed"
generator = "bitcoin-catch-up"
source = "formule de la section 11 du livre blanc de Bitcoin (Nakamoto, 2008), calculée par Sensitor pour un attaquant détenant 10 %, 20 % ou 30 % de la puissance de calcul"
url = "https://bitcoin.org/bitcoin.pdf"
license = "calcul Sensitor, aucune donnée tierce"
retrieved = 2026-10-19
unit = ""
columns = ["confirmations", "q10", "q20", "q30"]
notes = "Le modèle suppose une puissance constante et un attaquant qui prépare sa chaîne en secret ; il ne tient pas compte du coût de l'attaque."

[[dataset]]
id = "mois-de-trading"
title = "Un mois de trading, trade par trade : la courbe réalisée et celle du plan seul"
kind = "computed"
generator = "process-case-month"
source = "journal construit pour la leçon : 24 trades en R, dont 6 qui enfreignent une règle du plan ; calcul Sensitor"
license = "calcul Sensitor, aucune donnée tierce"
retrieved = 2026-10-19
synthetic = true
unit = "R"
columns = ["trade", "realise", "plan", "ecart"]
notes = "La courbe du plan seul compte zéro pour chaque trade qui enfreint une règle : c'est ce qu'aurait donné le mois si ces trades n'avaient pas été pris, toutes choses égales par ailleurs."

[[dataset]]
id = "reseau-bitcoin"
title = "Difficulté, durée des périodes et puissance de calcul du réseau Bitcoin, depuis 2009"
kind = "file"
file = "reseau-bitcoin.csv"
source = "données publiques de la chaîne Bitcoin : en-tête du premier bloc de chaque période de 2 016 blocs (horodatage et champ bits), relevé via l'API publique de mempool.space et identique sur tout nœud Bitcoin ; difficulté décodée du champ bits, durée des périodes et puissance de calcul calculées par Sensitor"
url = "https://mempool.space/docs/api/rest"
license = "faits publics de la chaîne Bitcoin, calcul Sensitor ; aucune donnée tierce sous licence"
retrieved = 2026-10-19
unit = "EH/s"
columns = ["date", "hauteur", "horodatage", "bits", "horodatage_suivant", "hauteur_suivante", "difficulte", "jours", "puissance"]
notes = "La puissance de calcul est une estimation : difficulté × 2³² ÷ temps moyen entre deux blocs de la période. Les horodatages des blocs sont fixés par les mineurs et peuvent s'écarter de quelques minutes ou heures de l'heure réelle."

