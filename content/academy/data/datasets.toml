file = "chomage-etats-unis.csv"
source = "U.S. Bureau of Labor Statistics, Unemployment Rate (UNRATE, corrigé des variations saisonnières), via FRED, Federal Reserve Bank of St. Louis"
url = "https://fred.stlouisfed.org/series/UNRATE"
license = "données publiques du Bureau of Labor Statistics, diffusées par FRED"
retrieved = 2026-10-19
unit = "%"
columns = ["mois", "chomage"]
notes = "Le taux d'octobre 2025 n'a pas été publié : le point manque, il n'est pas interpolé."

[[dataset]]
id = "taux-2-ans-fed"
title = "Rendement du Trésor américain à 2 ans et taux des fonds fédéraux, mensuels, depuis 2015"
kind = "file"
file = "taux-2-ans-fed.csv"
source = "Board of Governors of the Federal Reserve System, Market Yield on U.S. Treasury Securities at 2-Year Constant Maturity (GS2, moyenne mensuelle) et Federal Funds Effective Rate (FEDFUNDS), via FRED, Federal Reserve Bank of St. Louis"
url = "https://fred.stlouisfed.org/series/GS2"
license = "données publiques de la Réserve fédérale, diffusées par FRED"
