[[dataset]]
id = "courbe-taux-us"
title = "Rendements du Trésor américain à 10 et 2 ans, et leur écart, mensuels, depuis 1977"
kind = "file"
file = "courbe-taux-us.csv"
source = "Board of Governors of the Federal Reserve System, Market Yield on U.S. Treasury Securities at 10-Year et 2-Year Constant Maturity (GS10 et GS2, moyennes mensuelles), via FRED, Federal Reserve Bank of St. Louis ; écart calculé par Sensitor"
url = "https://fred.stlouisfed.org/series/GS10"
license = "données publiques de la Réserve fédérale, diffusées par FRED"
retrieved = 2026-10-19
unit = "%"
columns = ["mois", "dix_ans", "deux_ans", "ecart"]
notes = "Écart en points de pourcentage : 10 ans moins 2 ans. Négatif, la courbe est dite inversée."

[[dataset]]
id = "rattrapage-attaquant"
title = "Probabilité qu'un attaquant rattrape la chaîne honnête, selon le nombre de confirmations"
kind = "computed"
generator = "bitcoin-catch-up"
source = "formule de la section 11 du livre blanc de Bitcoin (Nakamoto, 2008), calculée par Sensitor pour un attaquant détenant 10 %, 20 % ou 30 % de la puissance de calcul"
url = "https://bitcoin.org/bitcoin.pdf"
license = "calcul Sensitor, aucune donnée tierce"
retrieved = 2026-10-19
unit = ""
columns = ["confirmations", "q10", "q20", "q30"]
notes = "Le modèle suppose une puissance constante et un attaquant qui prépare sa chaîne en secret ; il ne tient pas compte du coût de l'attaque."

[[dataset]]
id = "mois-de-trading"
title = "Un mois de trading, trade par trade : la courbe réalisée et celle du plan seul"
kind = "computed"
generator = "process-case-month"
source = "journal construit pour la leçon : 24 trades en R, dont 6 qui enfreignent une règle du plan ; calcul Sensitor"
license = "calcul Sensitor, aucune donnée tierce"
retrieved = 2026-10-19
synthetic = true
unit = "R"
columns = ["trade", "realise", "plan", "ecart"]
notes = "La courbe du plan seul compte zéro pour chaque trade qui enfreint une règle : c'est ce qu'aurait donné le mois si ces trades n'avaient pas été pris, toutes choses égales par ailleurs."

[[dataset]]
id = "reseau-bitcoin"
title = "Difficulté, durée des périodes et puissance de calcul du réseau Bitcoin, depuis 2009"
kind = "file"
file = "reseau-bitcoin.csv"
source = "données publiques de la chaîne Bitcoin : en-tête du premier bloc de chaque période de 2 016 blocs (horodatage et champ bits), relevé via l'API publique de mempool.space et identique sur tout nœud Bitcoin ; difficulté décodée du champ bits, durée des périodes et puissance de calcul calculées par Sensitor"
url = "https://mempool.space/docs/api/rest"
license = "faits publics de la chaîne Bitcoin, calcul Sensitor ; aucune donnée tierce sous licence"
retrieved = 2026-10-19
unit = "EH/s"
columns = ["date", "hauteur", "horodatage", "bits", "horodatage_suivant", "hauteur_suivante", "difficulte", "jours", "puissance"]
notes = "La puissance de calcul est une estimation : difficulté × 2³² ÷ temps moyen entre deux blocs de la période. Les horodatages des blocs sont fixés par les mineurs et peuvent s'écarter de quelques minutes ou heures de l'heure réelle."

[[dataset]]
id = "offre-monnaie-comparee"
title = "Croissance sur un an de l'offre de bitcoins, de la masse monétaire M3 de la zone euro et de M2 aux États-Unis, depuis 2014"
kind = "file"
file = "offre-monnaie-comparee.csv"
source = "Bitcoin : offre calculée par Sensitor à partir des règles d'émission et de la hauteur de bloc au début de chaque mois, interpolée entre les en-têtes de la chaîne (jeu « reseau-bitcoin ») ; zone euro : Banque centrale européenne, série BSI.M.U2.Y.V.M30.X.I.U2.2300.Z01.A (M3, taux de croissance annuel) ; États-Unis : Board of Governors of the Federal Reserve System, série M2SL (M2, corrigé des variations saisonnières), via FRED, taux annuel calculé par Sensitor"
url = "https://fred.stlouisfed.org/series/M2SL"
license = "faits publics de la chaîne Bitcoin et calcul Sensitor ; statistiques BCE réutilisables avec mention de la source ; données publiques de la Réserve fédérale, diffusées par FRED"
retrieved = 2026-10-20
unit = "%"
columns = ["mois", "bitcoin", "zone_euro_m3", "etats_unis_m2", "stock_flux_bitcoin"]
notes = "Le stock-to-flow de Bitcoin est l'offre existante divisée par l'émission de l'année écoulée : 100 divisé par le taux de croissance. Les derniers mois de M3 et de M2 ne sont pas encore publiés."
