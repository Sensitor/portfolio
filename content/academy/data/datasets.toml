# Les données des graphiques de l'Academy.
#
# Chaque jeu de données dit d'où il vient, sous quelle licence et à quelle date
# il a été récupéré ou calculé. Le chargeur refuse un jeu sans ces informations,
# et la ligne de source affichée sous chaque graphique en est tirée.
#
# kind = "file"     : un fichier CSV de ce dossier, tel que récupéré.
# kind = "computed" : calculé par un générateur Python testé (sensitor/academy).
# synthetic = true  : exemple construit pour une leçon, signalé comme tel.

[[dataset]]
id = "btc-emission"
title = "Émission de Bitcoin par époque de halving"
kind = "computed"
generator = "bitcoin-issuance"
source = "règles du protocole Bitcoin (récompense initiale de 50 BTC, divisée par deux tous les 210 000 blocs, arrondie au satoshi) ; dates des halvings passés relevées sur la chaîne, dates futures estimées à 10 minutes par bloc"
url = "https://bitcoin.org/bitcoin.pdf"
license = "calcul Sensitor, aucune donnée tierce"
retrieved = 2026-10-17
unit = "BTC"
columns = ["annee", "date", "recompense", "offre", "part", "estimation"]
notes = "Les dates à partir de 2028 sont des estimations : la durée réelle d'une époque dépend du rythme de production des blocs."

[[dataset]]
id = "taux-directeurs"
title = "Taux de la BCE et de la Réserve fédérale, mensuels, depuis 1999"
kind = "file"
file = "taux-directeurs.csv"
source = "Banque centrale européenne, Data Portal, série FM.D.U2.EUR.4F.KR.DFR.LEV (taux de la facilité de dépôt, valeur en fin de mois) ; Board of Governors of the Federal Reserve System, série FEDFUNDS (taux effectif des fonds fédéraux, moyenne mensuelle), via FRED, Federal Reserve Bank of St. Louis"
url = "https://data.ecb.europa.eu/data/datasets/FM/FM.D.U2.EUR.4F.KR.DFR.LEV"
license = "statistiques BCE réutilisables avec mention de la source ; données publiques de la Réserve fédérale, diffusées par FRED"
retrieved = 2026-10-17
unit = "%"
columns = ["mois", "bce_depot", "fed_funds"]
notes = "Les deux séries ne mesurent pas exactement la même chose : la BCE fixe le taux de sa facilité de dépôt, la Réserve fédérale vise une fourchette dont la série donne la moyenne effective du mois."

[[dataset]]
id = "credit-amortissement"
title = "Un crédit de 200 000 € à 4 % sur 20 ans, année par année"
kind = "computed"
generator = "loan-amortisation"
source = "formule de l'annuité constante, mensualités, taux fixe ; exemple pédagogique de la leçon sur le taux d'intérêt"
license = "calcul Sensitor, aucune donnée tierce"
retrieved = 2026-10-17
unit = "€"
columns = ["annee", "interets", "capital", "restant"]
notes = "Un crédit réel ajoute assurance, frais de dossier et de garantie, que l'exemple ne compte pas."

[[dataset]]
id = "inflation-zone-euro-france-us"
title = "Inflation annuelle : zone euro, France, États-Unis, mensuelle depuis 1997"
kind = "file"
file = "inflation-zone-euro-france-us.csv"
source = "Eurostat, jeu prc_hicp_minr (IPCH, ECOICOP ver. 2, taux de variation annuel, ensemble des biens et services), zone euro et France ; U.S. Bureau of Labor Statistics, Consumer Price Index for All Urban Consumers (CPIAUCSL, corrigé des variations saisonnières), via FRED, taux annuel calculé par Sensitor"
url = "https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_minr/default/table"
license = "données Eurostat réutilisables avec mention de la source (décision 2011/833/UE) ; données publiques du Bureau of Labor Statistics"
retrieved = 2026-10-17
unit = "%"
columns = ["mois", "zone_euro", "france", "etats_unis"]
notes = "L'indice américain d'octobre 2025 n'a pas été publié : le point manque, il n'est pas interpolé."

[[dataset]]
id = "inflation-composantes-zone-euro"
title = "Inflation de la zone euro par composante, mensuelle depuis 2015"
kind = "file"
file = "inflation-composantes-zone-euro.csv"
source = "Eurostat, jeu prc_hicp_minr (IPCH, ECOICOP ver. 2, taux de variation annuel) : ensemble, énergie, alimentation y compris alcool et tabac, biens industriels hors énergie, services, et ensemble hors énergie, alimentation, alcool et tabac"
url = "https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_minr/default/table"
license = "données Eurostat réutilisables avec mention de la source (décision 2011/833/UE)"
retrieved = 2026-10-17
unit = "%"
columns = ["mois", "ensemble", "energie", "alimentation", "biens", "services", "sous_jacente"]

[[dataset]]
id = "m3-inflation-zone-euro"
title = "Croissance de la masse monétaire M3 et inflation, zone euro, depuis 1999"
kind = "file"
file = "m3-inflation-zone-euro.csv"
source = "Banque centrale européenne, Data Portal, série BSI.M.U2.Y.V.M30.X.I.U2.2300.Z01.A (M3, taux de croissance annuel) ; Eurostat, jeu prc_hicp_minr (IPCH, taux de variation annuel)"
url = "https://data.ecb.europa.eu/data/datasets/BSI/BSI.M.U2.Y.V.M30.X.I.U2.2300.Z01.A"
license = "statistiques BCE réutilisables avec mention de la source ; données Eurostat réutilisables avec mention de la source (décision 2011/833/UE)"
retrieved = 2026-10-17
unit = "%"
columns = ["mois", "m3", "inflation"]

[[dataset]]
id = "pouvoir-achat-france"
title = "Ce que valent 100 € de janvier 1996, en France, chaque janvier depuis"
kind = "file"
file = "pouvoir-achat-france.csv"
source = "Eurostat, jeu prc_hicp_minr (IPCH, ECOICOP ver. 2, indice base 2025 = 100), France ; valeur réelle calculée par Sensitor : 100 × indice de janvier 1996 ÷ indice du mois"
url = "https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_minr/default/table"
license = "données Eurostat réutilisables avec mention de la source (décision 2011/833/UE)"
retrieved = 2026-10-17
unit = "€"
columns = ["mois", "indice", "valeur_reelle_100"]

[[dataset]]
id = "inflation-taux-etats-unis"
title = "Inflation et taux des fonds fédéraux aux États-Unis, mensuels, depuis 1960"
kind = "file"
file = "inflation-taux-etats-unis.csv"
source = "U.S. Bureau of Labor Statistics, Consumer Price Index for All Urban Consumers (CPIAUCSL, corrigé des variations saisonnières), taux annuel calculé par Sensitor ; Board of Governors of the Federal Reserve System, Federal Funds Effective Rate (FEDFUNDS) ; via FRED, Federal Reserve Bank of St. Louis"
url = "https://fred.stlouisfed.org/series/CPIAUCSL"
license = "données publiques du Bureau of Labor Statistics et de la Réserve fédérale, diffusées par FRED"
retrieved = 2026-10-17
unit = "%"
columns = ["mois", "inflation", "fed_funds"]
notes = "L'indice d'octobre 2025 n'a pas été publié : le point manque."
