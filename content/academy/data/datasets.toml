# Les données des graphiques de l'Academy.
#
# Chaque jeu de données dit d'où il vient, sous quelle licence et à quelle date
# il a été récupéré ou calculé. Le chargeur refuse un jeu sans ces informations,
# et la ligne de source affichée sous chaque graphique en est tirée.
#
# kind = "file"     : un fichier CSV de ce dossier, tel que récupéré.
# kind = "computed" : calculé par un générateur Python testé (sensitor/academy).
# synthetic = true  : exemple construit pour une leçon, signalé comme tel.

[[dataset]]
id = "btc-emission"
title = "Émission de Bitcoin par époque de halving"
kind = "computed"
generator = "bitcoin-issuance"
source = "règles du protocole Bitcoin (récompense initiale de 50 BTC, divisée par deux tous les 210 000 blocs, arrondie au satoshi) ; dates des halvings passés relevées sur la chaîne, dates futures estimées à 10 minutes par bloc"
url = "https://bitcoin.org/bitcoin.pdf"
license = "calcul Sensitor, aucune donnée tierce"
retrieved = 2026-10-17
unit = "BTC"
columns = ["annee", "date", "recompense", "offre", "part", "estimation"]
notes = "Les dates à partir de 2028 sont des estimations : la durée réelle d'une époque dépend du rythme de production des blocs."

[[dataset]]
id = "taux-directeurs"
title = "Taux de la BCE et de la Réserve fédérale, mensuels, depuis 1999"
kind = "file"
file = "taux-directeurs.csv"
source = "Banque centrale européenne, Data Portal, série FM.D.U2.EUR.4F.KR.DFR.LEV (taux de la facilité de dépôt, valeur en fin de mois) ; Board of Governors of the Federal Reserve System, série FEDFUNDS (taux effectif des fonds fédéraux, moyenne mensuelle), via FRED, Federal Reserve Bank of St. Louis"
url = "https://data.ecb.europa.eu/data/datasets/FM/FM.D.U2.EUR.4F.KR.DFR.LEV"
license = "statistiques BCE réutilisables avec mention de la source ; données publiques de la Réserve fédérale, diffusées par FRED"
retrieved = 2026-10-17
unit = "%"
columns = ["mois", "bce_depot", "fed_funds"]
notes = "Les deux séries ne mesurent pas exactement la même chose : la BCE fixe le taux de sa facilité de dépôt, la Réserve fédérale vise une fourchette dont la série donne la moyenne effective du mois."

