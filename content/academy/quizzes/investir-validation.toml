[[question.option]]
id = "tendance"
text = "Être sûr que le marché va monter."
correct = true
explanation = "Exact : personne ne peut l'être."

[[question.option]]
id = "precaution"
text = "Avoir une épargne de précaution."
explanation = "C'est une condition."

[[question.option]]
id = "horizon"
text = "Avoir un horizon long."
explanation = "C'est une condition."

