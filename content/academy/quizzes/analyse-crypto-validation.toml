[[question]]
id = "cap"
prompt = "Que faut-il comparer d'un projet à l'autre ?"
kind = "single"
lesson = "prix-et-capitalisation"

[[question.option]]
id = "cap"
text = "La capitalisation, et la valorisation diluée."
correct = true
explanation = "Oui."

[[question.option]]
id = "prix"
text = "Le prix unitaire."
explanation = "Il dépend du nombre de jetons."

[[question.option]]
id = "nom"
text = "La notoriété du nom."
explanation = "Elle ne mesure aucune valeur."

[[question]]
id = "prix"
prompt = "Capitalisation 1 milliard, 10 milliards de jetons à terme. Prix à capitalisation inchangée ?"
kind = "single"
lesson = "prix-et-capitalisation"

[[question.option]]
id = "010"
text = "0,10 dollar"
correct = true
explanation = "Oui."

[[question.option]]
id = "1"
text = "1 dollar"
explanation = "Il faudrait une capitalisation de 10 milliards."

[[question.option]]
id = "050"
text = "0,50 dollar"
explanation = "C'est le prix de départ de l'exemple."

[[question]]
id = "non-staker"
prompt = "Émission de staking de 8 % par an. Que devient la part de celui qui ne stake pas après un an ?"
kind = "single"
lesson = "emission-et-deblocages"

[[question.option]]
id = "926"
text = "Environ 92,6 % de sa part initiale"
correct = true
explanation = "Oui : 1 ÷ 1,08."

[[question.option]]
id = "108"
text = "108 %"
explanation = "Il ne reçoit pas les nouveaux jetons."

[[question.option]]
id = "100"
text = "100 %"
explanation = "Sa part se dilue."

[[question]]
id = "subvention"
prompt = "Un revenu net négatif signifie que :"
kind = "single"
lesson = "revenus-et-incitations"

[[question.option]]
id = "paie"
text = "le protocole paie plus pour son activité qu'elle ne lui rapporte."
correct = true
explanation = "Oui."

[[question.option]]
id = "rentable"
text = "le protocole est très rentable."
explanation = "C'est l'inverse."

[[question.option]]
id = "rien"
text = "rien de particulier."
explanation = "Cela ne peut pas durer."

[[question]]
id = "liquidation"
