explanation = "C'est un enchaînement rapide."

[[question.option]]
id = "gain"
text = "Une série de gains."
explanation = "C'est une série de ventes forcées."

[[question]]
id = "ip"
prompt = "Le prix relatif quadruple. Perte impermanente ?"
