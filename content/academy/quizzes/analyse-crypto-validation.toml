lesson = "preter-emprunter"

[[question.option]]
id = "1875"
text = "1 875 dollars"
correct = true
explanation = "Oui."

[[question.option]]
id = "1500"
text = "1 500 dollars"
explanation = "Il faut appliquer le seuil."

[[question.option]]
id = "2400"
text = "2 400 dollars"
explanation = "C'est 80 % de 3 000."

[[question]]
id = "cascade"
prompt = "Qu'est-ce qu'une liquidation en cascade ?"
kind = "single"
lesson = "preter-emprunter"

[[question.option]]
id = "cascade"
text = "Des liquidations qui vendent des garanties, font baisser les prix et déclenchent d'autres liquidations."
correct = true
explanation = "Oui."

[[question.option]]
id = "une"
