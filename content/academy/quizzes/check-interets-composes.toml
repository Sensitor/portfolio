kind = "single"
lesson = "interets-composes"

[[question.option]]
id = "moins25"
text = "Une perte de 25 %."
correct = true
explanation = "100 → 150 → 75."

[[question.option]]
id = "zero"
text = "Aucun changement."
explanation = "La perte s'applique à un capital plus grand."

[[question.option]]
