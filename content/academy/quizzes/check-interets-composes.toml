[[question]]
id = "72"
prompt = "À 6 % par an, en combien d'années environ un capital double-t-il ?"
kind = "single"
lesson = "interets-composes"

[[question.option]]
id = "12"
text = "Environ 12 ans."
correct = true
explanation = "72 ÷ 6 ; le calcul exact donne 11,9 ans."

[[question.option]]
id = "6"
text = "6 ans."
explanation = "Ce serait à 12 %."

[[question.option]]
id = "17"
text = "Environ 17 ans."
explanation = "C'est 100 ÷ 6, sans composition."

[[question]]
