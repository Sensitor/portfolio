text = "Un gain."
explanation = "C'est une perte."

[[question]]
id = "moyenne"
prompt = "Quelle moyenne mesure ce que l'on a réellement gagné sur plusieurs années ?"
kind = "single"
lesson = "interets-composes"

[[question.option]]
id = "geo"
text = "La moyenne géométrique."
correct = true
explanation = "Le taux constant qui donne le même résultat final."

[[question.option]]
id = "arith"
text = "La moyenne arithmétique."
explanation = "Elle surestime le rendement quand les résultats sont dispersés."

[[question.option]]
