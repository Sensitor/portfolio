lesson = "revanche"

[[question.option]]
id = "9411"
text = "9 411,90 $"
correct = true
explanation = "9 702,99 × 0,97."

[[question.option]]
id = "9605"
text = "9 605,96 $"
explanation = "C'est le résultat à 1 %."

[[question.option]]
id = "9400"
text = "9 400,00 $"
