[[question]]
id = "signes"
prompt = "Lesquels sont des signes d'un trade de revanche ? Cochez toutes les bonnes réponses."
kind = "multiple"
lesson = "revanche"

[[question.option]]
id = "apres"
text = "Il suit de près une ou plusieurs pertes."
correct = true
explanation = "Oui."

[[question.option]]
id = "taille"
text = "Il est plus gros que d'habitude."
correct = true
explanation = "Oui, souvent."

[[question.option]]
id = "plan"
text = "Il figurait dans le plan écrit avant la séance."
explanation = "Un trade prévu par le plan, à la taille prévue, n'en est pas un."

[[question]]
id = "regle"
prompt = "Pourquoi écrire les règles d'arrêt avant la séance ?"
kind = "single"
lesson = "revanche"

[[question.option]]
id = "calme"
text = "Parce que la décision de s'arrêter se prend mal juste après une perte."
correct = true
explanation = "La règle déplace la décision vers un moment calme."

[[question.option]]
id = "obligation"
text = "Parce que c'est une obligation réglementaire."
explanation = "Ce n'en est pas une ; c'est une protection personnelle."

[[question.option]]
id = "gain"
text = "Parce qu'elles augmentent le taux de réussite."
explanation = "Elles limitent les pertes ; elles ne changent pas le taux de réussite."
