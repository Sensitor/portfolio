correct = true
explanation = "1,0900 − 0,62 × 0,0100 = 1,0838."

[[question.option]]
id = "62"
text = "1,0862"
explanation = "C'est 62 % mesuré depuis le départ, soit un retour de 38 % seulement."

[[question.option]]
