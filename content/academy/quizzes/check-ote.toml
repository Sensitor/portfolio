[[question.option]]
id = "milieu"
text = "Autour de 2 430, le milieu de la jambe."
explanation = "2 430 est le niveau de 50 %, hors de la zone OTE."

[[question]]
id = "statut"
prompt = "Que représente la zone de 62 à 79 % ?"
kind = "single"
lesson = "ote-retracements"

[[question.option]]
id = "convention"
text = "Une convention de mesure, dont l'intérêt se juge sur un échantillon."
correct = true
explanation = "C'est la position du parcours."

[[question.option]]
id = "loi"
text = "Une zone que le prix respecte en vertu des proportions de Fibonacci."
explanation = "Aucune raison démontrée ne l'impose au prix."

[[question.option]]
id = "garantie"
text = "La zone où le retour s'arrête dans la majorité des cas."
explanation = "Cela n'est vrai que si on l'a mesuré sur son instrument, et rien ne le garantit."
