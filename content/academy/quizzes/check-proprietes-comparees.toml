[[question.option]]
id = "verif"
text = "La rareté vérifiable : chacun peut contrôler l'offre avec un nœud."
correct = true
explanation = "Oui."

[[question.option]]
id = "anciennete"
text = "L'ancienneté."
explanation = "L'or a des millénaires d'histoire, Bitcoin moins de vingt ans."

[[question.option]]
id = "stabilite"
text = "La stabilité du pouvoir d'achat."
