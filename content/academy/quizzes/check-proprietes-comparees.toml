lesson = "proprietes-comparees"

[[question.option]]
id = "anciennete"
text = "Sur l'ancienneté et la durabilité."
correct = true
explanation = "Oui."

[[question.option]]
id = "transport"
text = "Sur le transport."
explanation = "L'or est lourd et coûteux à déplacer."

[[question.option]]
id = "division"
text = "Sur la division."
explanation = "Il est difficile à fractionner physiquement."

[[question]]
id = "vainqueur"
prompt = "Que retenir du tableau comparatif ?"
kind = "single"
lesson = "proprietes-comparees"

[[question.option]]
id = "aucun"
