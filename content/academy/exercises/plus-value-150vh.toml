id = "plus-value-150vh"
title = "Calculer une plus-value sur actifs numériques"
context = """
Un particulier a acheté au fil des années des cryptoactifs pour un **prix total d'acquisition de 10 000 €**. Son portefeuille vaut **25 000 €** quand il en vend pour **5 000 €** contre des euros. *Chiffres construits pour l'exercice.*

Hypothèse de taux : **31,4 %** (prélèvement forfaitaire unique). Vérifiez le taux de l'année sur impots.gouv.fr.
"""
conclusion = """
La vente représente 20 % du portefeuille : elle emporte 20 % du prix total d'acquisition, soit 2 000 €. La plus-value est de 3 000 €, et l'impôt, au taux de l'exercice, de 942 €. Le prix total d'acquisition qui reste attaché au portefeuille tombe à 8 000 € : c'est lui qui servira pour la vente suivante.
"""

[[step]]
id = "fraction"
prompt = "Quelle fraction du portefeuille la vente représente-t-elle, en % ?"
unit = "%"
answer = 20
tolerance = 0.01
solution = "5 000 ÷ 25 000 = **20 %**."

[[step]]
id = "acquisition"
prompt = "Quelle part du prix total d'acquisition s'impute sur cette vente, en € ?"
unit = "€"
answer = 2000
tolerance = 0.5
solution = "10 000 × 20 % = **2 000 €**."

[[step]]
id = "plus-value"
prompt = "Quelle est la plus-value, en € ?"
unit = "€"
answer = 3000
tolerance = 0.5
solution = "5 000 − 2 000 = **3 000 €**."

[[step]]
id = "impot"
prompt = "Quel est l'impôt au taux de l'exercice, en € ?"
unit = "€"
answer = 942
tolerance = 0.5
solution = "3 000 × 31,4 % = **942 €**."

[[step]]
id = "reste"
prompt = "Quel prix total d'acquisition reste attaché au portefeuille, en € ?"
unit = "€"
answer = 8000
tolerance = 0.5
solution = "10 000 − 2 000 = **8 000 €**."
