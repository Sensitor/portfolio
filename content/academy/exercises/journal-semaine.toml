id = "journal-semaine"
title = "Une semaine de journal"
context = """
Dix trades de la semaine, en R, dans l'ordre. *Journal construit pour l'exercice.*

| Trade | Résultat | Règles respectées |
|---|---|---|
| 1 | +2,0R | oui |
| 2 | −1,0R | oui |
| 3 | −1,0R | oui |
| 4 | −1,5R | non : stop éloigné |
| 5 | +1,8R | oui |
| 6 | −1,0R | non : hors plan |
| 7 | −1,0R | oui |
| 8 | +2,2R | oui |
| 9 | −1,0R | oui |
| 10 | −1,0R | non : revanche |
"""
conclusion = """
La semaine finit à −1,5R. Les sept trades conformes ont rapporté +2,0R, soit +0,29R en moyenne ; les trois écarts ont coûté −3,5R. Dix trades ne jugent pas une stratégie, mais ils suffisent à montrer où travailler : respecter le plan aurait changé le signe de la semaine.
"""

[[step]]
id = "total"
prompt = "Quel est le résultat de la semaine, en R ?"
unit = "R"
answer = -1.5
tolerance = 0.001
solution = "2 − 1 − 1 − 1,5 + 1,8 − 1 − 1 + 2,2 − 1 − 1 = **−1,5R**."

[[step]]
id = "respect"
prompt = "Quel est le taux de respect du plan, en % ?"
unit = "%"
answer = 70
tolerance = 0.1
solution = "7 trades conformes sur 10 : **70 %**."

[[step]]
id = "conformes"
prompt = "Quel est le résultat des trades conformes, en R ?"
unit = "R"
answer = 2.0
tolerance = 0.001
solution = "2 − 1 − 1 + 1,8 − 1 + 2,2 − 1 = **+2,0R**."

[[step]]
id = "esperance"
prompt = "Quelle est leur espérance, en R par trade ? (Deux décimales.)"
unit = "R"
answer = 0.29
tolerance = 0.006
solution = "2,0 ÷ 7 = **+0,29R**."

[[step]]
id = "cout"
prompt = "Quel est le coût des écarts, en R ?"
unit = "R"
answer = -3.5
tolerance = 0.001
solution = "−1,5 − 1 − 1 = **−3,5R**."
