id = "capitalisation-fdv"
title = "Capitalisation et valorisation diluée"
context = """
Un jeton cote **0,50 dollar**. **2 milliards** de jetons sont en circulation, sur une offre maximale de **10 milliards**. *Chiffres construits pour l'exercice.*
"""
conclusion = """
La capitalisation est de 1 milliard de dollars, la valorisation diluée de 5 milliards. Seuls 20 % des jetons circulent : si les 8 milliards restants arrivaient sans demande nouvelle, le prix devrait tomber à 0,10 dollar pour que la valeur totale ne change pas. Le prix de 0,50 dollar ne dit rien de tout cela.
"""

[[step]]
id = "cap"
prompt = "Quelle est la capitalisation, en milliards de dollars ?"
unit = "Md$"
answer = 1
tolerance = 0.001
solution = "0,50 × 2 milliards = **1 milliard de dollars**."

[[step]]
id = "fdv"
prompt = "Quelle est la valorisation totalement diluée, en milliards de dollars ?"
unit = "Md$"
answer = 5
tolerance = 0.001
solution = "0,50 × 10 milliards = **5 milliards de dollars**."

[[step]]
id = "part"
prompt = "Quelle part de l'offre maximale circule aujourd'hui, en % ?"
unit = "%"
answer = 20
tolerance = 0.01
solution = "2 ÷ 10 = **20 %**."

[[step]]
id = "prix"
prompt = "À capitalisation inchangée, quel serait le prix une fois les 10 milliards en circulation, en dollars ?"
unit = "$"
answer = 0.10
tolerance = 0.001
solution = "1 milliard ÷ 10 milliards = **0,10 dollar**."
