id = "revue-echantillon"
title = "Combien de trades avant de juger une règle"
context = """
Un trader envisage de changer une règle de sortie. Sur ses **30** derniers trades conformes, l'espérance mesurée est de **+0,15R**, avec un écart type de **1,3R**.

Rappel : erreur type = écart type ÷ √n ; intervalle à 95 % ≈ espérance ± 1,96 × erreur type ; trades nécessaires = (1,96 × écart type ÷ demi-largeur)².
"""
conclusion = """
Sur 30 trades, l'intervalle va d'environ −0,32 à +0,62R : il contient zéro, et contiendrait aussi bien une règle excellente qu'une règle sans avantage. Pour une précision de ±0,10R, il faudrait 650 trades. D'où la règle de la revue mensuelle : une modification se teste d'abord, sur un historique ou à taille réduite, avant d'entrer dans le plan.
"""

[[step]]
id = "erreur"
prompt = "Quelle est l'erreur type de l'espérance, en R ? (Deux décimales.)"
unit = "R"
answer = 0.24
tolerance = 0.006
solution = "1,3 ÷ √30 = 1,3 ÷ 5,48 = **0,24R**."

[[step]]
id = "bas"
prompt = "Quelle est la borne basse de l'intervalle à 95 % ? (Deux décimales.)"
unit = "R"
answer = -0.32
tolerance = 0.006
solution = "0,15 − 1,96 × 0,237 = **−0,32R**."

[[step]]
id = "haut"
prompt = "Et la borne haute ?"
unit = "R"
answer = 0.62
tolerance = 0.006
solution = "0,15 + 1,96 × 0,237 = **+0,62R**."

[[step]]
id = "trades"
prompt = "Combien de trades faudrait-il pour une demi-largeur de 0,10R ? (Arrondi à l'entier supérieur.)"
unit = "trades"
answer = 650
tolerance = 1
solution = "(1,96 × 1,3 ÷ 0,10)² = 25,48² = 649,2, soit **650 trades**."
