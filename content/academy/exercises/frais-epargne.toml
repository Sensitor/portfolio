id = "frais-epargne"
title = "Les frais et l'impôt sur trente ans"
context = """
10 000 € placés **30 ans** à **6 %** par an, sans versement supplémentaire. Inflation : **2 %** par an.

Trois cas : sans frais ; avec **1,5 %** de frais par an prélevés sur l'encours ; avec ces frais et un impôt de **30 %** sur les gains à la sortie (hypothèse de calcul).

Utilisez le simulateur de la leçon précédente, ou la formule : chaque mois, le capital croît de 1,06^(1/12) et perd la part (1 − 0,985^(1/12)) de frais.
"""
conclusion = """
Sans frais, 57 435 €. Avec 1,5 % de frais, 36 497 €, soit 36,5 % de moins. Avec l'impôt en plus, 28 548 €, et 15 761 € en pouvoir d'achat d'aujourd'hui. Le rendement affiché de 6 % est devenu, net de tout, un peu plus de 1,5 % réel par an.
"""

[[step]]
id = "sans-frais"
prompt = "Que devient le capital sans frais, après 30 ans ? (À l'euro près.)"
unit = "€"
answer = 57434.91
tolerance = 1
solution = "10 000 × 1,06^30 = **57 434,91 €**."

[[step]]
id = "avec-frais"
prompt = "Et avec 1,5 % de frais par an ? (À l'euro près.)"
unit = "€"
answer = 36497.48
tolerance = 1
solution = "**36 497 €** environ : le rendement net de frais est d'environ 4,4 % par an."

[[step]]
id = "ecart"
prompt = "De combien de pourcents les frais réduisent-ils le capital final ? (Une décimale.)"
unit = "%"
answer = 36.5
tolerance = 0.06
solution = "1 − 36 497 ÷ 57 435 = **36,5 %**."

[[step]]
id = "frais-payes"
prompt = "Combien de frais ont été payés au total ? (À l'euro près.)"
unit = "€"
answer = 9302.38
tolerance = 1
solution = "Somme des frais mensuels : **9 302 €** environ. Le reste de l'écart vient des gains que ces frais n'ont pas pu produire."

[[step]]
id = "apres-impot"
prompt = "Avec en plus un impôt de 30 % sur les gains, que reçoit l'épargnant ? (À l'euro près.)"
unit = "€"
answer = 28548.24
tolerance = 1
solution = "Gains : 36 497 − 10 000 = 26 497 ; impôt : 7 949 ; reste **28 548 €**."

[[step]]
id = "reel"
prompt = "Et en pouvoir d'achat d'aujourd'hui, avec 2 % d'inflation ? (À l'euro près.)"
unit = "€"
answer = 15760.65
tolerance = 1
solution = "28 548 ÷ 1,02^30 = **15 761 €**."
