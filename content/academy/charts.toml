title = "La puissance de calcul du réseau Bitcoin, mesurée sur la chaîne depuis 2009"

[[chart.series]]
column = "puissance"
label = "Puissance estimée (exahashes par seconde)"

[[chart]]
id = "duree-periodes"
dataset = "reseau-bitcoin"
kind = "bar"
x = "date"
x_label = "Début de la période de 2 016 blocs"
