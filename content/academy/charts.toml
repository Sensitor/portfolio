# Les graphiques interactifs que les leçons appellent avec « ::: chart <id> ».
# Chaque graphique lit un jeu de données de data/datasets.toml ; sa source
# s'affiche automatiquement en dessous.

[[chart]]
id = "emission-bitcoin"
dataset = "btc-emission"
kind = "step"
x = "date"
x_label = "Début de l'époque"
y_label = "BTC en circulation"
highlight = "estimation"
title = "L'offre de Bitcoin, époque par époque"

[[chart.series]]
column = "offre"
label = "Offre en circulation (BTC)"

