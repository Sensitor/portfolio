# Les graphiques interactifs que les leçons appellent avec « ::: chart <id> ».
# Chaque graphique lit un jeu de données de data/datasets.toml ; sa source
# s'affiche automatiquement en dessous.

[[chart]]
id = "emission-bitcoin"
dataset = "btc-emission"
kind = "step"
x = "date"
x_label = "Début de l'époque"
y_label = "BTC en circulation"
highlight = "estimation"
title = "L'offre de Bitcoin, époque par époque"

[[chart.series]]
column = "offre"
label = "Offre en circulation (BTC)"

[[chart]]
id = "recompense-bitcoin"
dataset = "btc-emission"
kind = "bar"
x = "date"
x_label = "Début de l'époque"
y_label = "BTC créés par bloc"
highlight = "estimation"
title = "La récompense de bloc, divisée par deux tous les 210 000 blocs"

[[chart.series]]
column = "recompense"
label = "Récompense par bloc (BTC)"

[[chart]]
id = "taux-bce-fed"
dataset = "taux-directeurs"
kind = "step"
x = "mois"
x_label = "Mois"
y_label = "Taux annuel, en %"
title = "Le prix de l'argent fixé par deux banques centrales, depuis 1999"

[[chart.series]]
column = "bce_depot"
label = "BCE, facilité de dépôt"

[[chart.series]]
column = "fed_funds"
label = "États-Unis, fonds fédéraux (effectif)"

[[chart]]
id = "credit-interets-capital"
dataset = "credit-amortissement"
kind = "bar"
stacked = true
x = "annee"
x_label = "Année du crédit"
y_label = "Remboursé dans l'année, en €"
title = "Ce que paie chaque année l'emprunteur : d'abord des intérêts, puis du capital"

[[chart.series]]
column = "interets"
label = "Intérêts"

[[chart.series]]
column = "capital"
label = "Capital remboursé"

[[chart]]
id = "inflation-trois-zones"
dataset = "inflation-zone-euro-france-us"
kind = "line"
x = "mois"
x_label = "Mois"
y_label = "Hausse des prix sur un an, en %"
title = "L'inflation sur un an, depuis 1997"

[[chart.series]]
column = "zone_euro"
label = "Zone euro"

[[chart.series]]
column = "france"
label = "France"

[[chart.series]]
column = "etats_unis"
label = "États-Unis"

[[chart]]
id = "inflation-composantes"
dataset = "inflation-composantes-zone-euro"
kind = "line"
x = "mois"
x_label = "Mois"
y_label = "Hausse des prix sur un an, en %"
title = "Ce qui monte : l'inflation de la zone euro par composante"

[[chart.series]]
column = "energie"
label = "Énergie"

[[chart.series]]
column = "alimentation"
label = "Alimentation"

[[chart.series]]
column = "services"
label = "Services"

[[chart.series]]
column = "biens"
label = "Biens hors énergie"

[[chart.series]]
column = "sous_jacente"
label = "Inflation sous-jacente"

[[chart]]
id = "m3-inflation"
dataset = "m3-inflation-zone-euro"
kind = "line"
x = "mois"
x_label = "Mois"
y_label = "Taux de croissance sur un an, en %"
title = "La masse monétaire et les prix ne bougent pas au même rythme"

[[chart.series]]
column = "m3"
label = "Masse monétaire M3"

[[chart.series]]
column = "inflation"
label = "Inflation"

[[chart]]
id = "pouvoir-achat-100-euros"
