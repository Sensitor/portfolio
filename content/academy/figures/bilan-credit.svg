<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Un crédit crée un dépôt</title>
<desc id="d">Deux bilans de banque. Avant : réserves 10 et crédits 90 à l'actif, dépôts 92 et capital 8 au passif. Après un crédit de 10 : crédits 100 et dépôts 102, le bilan reste équilibré à 110.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b646b"/></marker></defs>
<text x="160" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">Avant le crédit</text>
<line x1="30" y1="56" x2="290" y2="56" stroke="#1b2733" stroke-width="1.4"/>
<line x1="160" y1="56" x2="160" y2="200" stroke="#1b2733" stroke-width="1.4"/>
<text x="95" y="50" text-anchor="middle" font-size="10.5" fill="#5b646b">ACTIF</text>
<text x="225" y="50" text-anchor="middle" font-size="10.5" fill="#5b646b">PASSIF</text>
<text x="40" y="84" font-size="12.5" fill="#1b2733">Réserves</text>
<text x="150" y="84" text-anchor="end" font-size="12.5" fill="#1b2733">10</text>
<text x="40" y="110" font-size="12.5" fill="#1b2733">Crédits</text>
<text x="150" y="110" text-anchor="end" font-size="12.5" fill="#1b2733">90</text>
<text x="170" y="84" font-size="12.5" fill="#1b2733">Dépôts</text>
<text x="280" y="84" text-anchor="end" font-size="12.5" fill="#1b2733">92</text>
<text x="170" y="110" font-size="12.5" fill="#1b2733">Capital</text>
<text x="280" y="110" text-anchor="end" font-size="12.5" fill="#1b2733">8</text>
<line x1="30" y1="176" x2="290" y2="176" stroke="#d9d5cb"/>
<text x="40" y="194" font-size="12" fill="#5b646b">Total</text>
<text x="150" y="194" text-anchor="end" font-size="12" font-weight="700" fill="#1b2733">100</text>
<text x="170" y="194" font-size="12" fill="#5b646b">Total</text>
<text x="280" y="194" text-anchor="end" font-size="12" font-weight="700" fill="#1b2733">100</text>
<text x="480" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">Après un crédit de 10</text>
<line x1="350" y1="56" x2="610" y2="56" stroke="#1b2733" stroke-width="1.4"/>
<line x1="480" y1="56" x2="480" y2="200" stroke="#1b2733" stroke-width="1.4"/>
<text x="415" y="50" text-anchor="middle" font-size="10.5" fill="#5b646b">ACTIF</text>
<text x="545" y="50" text-anchor="middle" font-size="10.5" fill="#5b646b">PASSIF</text>
<text x="360" y="84" font-size="12.5" fill="#1b2733">Réserves</text>
<text x="470" y="84" text-anchor="end" font-size="12.5" fill="#1b2733">10</text>
<text x="360" y="110" font-size="12.5" fill="#3f6553" font-weight="700">Crédits</text>
<text x="470" y="110" text-anchor="end" font-size="12.5" fill="#3f6553" font-weight="700">100</text>
<text x="490" y="84" font-size="12.5" fill="#3f6553" font-weight="700">Dépôts</text>
<text x="600" y="84" text-anchor="end" font-size="12.5" fill="#3f6553" font-weight="700">102</text>
<text x="490" y="110" font-size="12.5" fill="#1b2733">Capital</text>
<text x="600" y="110" text-anchor="end" font-size="12.5" fill="#1b2733">8</text>
<line x1="350" y1="176" x2="610" y2="176" stroke="#d9d5cb"/>
<text x="360" y="194" font-size="12" fill="#5b646b">Total</text>
<text x="470" y="194" text-anchor="end" font-size="12" font-weight="700" fill="#1b2733">110</text>
<text x="490" y="194" font-size="12" fill="#5b646b">Total</text>
<text x="600" y="194" text-anchor="end" font-size="12" font-weight="700" fill="#1b2733">110</text>
<line x1="296" y1="120" x2="342" y2="120" stroke="#5b646b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="480" y="232" text-anchor="middle" font-size="11.5" fill="#3f6553">+10 de crédits, +10 de dépôts : 10 de monnaie nouvelle</text>
<text x="30" y="282" font-size="11" fill="#7b8389">Bilan simplifié, en millions d'euros. Le crédit ne puise pas dans les dépôts existants : il en crée un, du même montant.</text>
</svg>
