<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Inflation, désinflation, déflation</title>
<desc id="d">Trois courbes du niveau des prix sur dix ans : une hausse régulière, une hausse qui ralentit, une baisse.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b646b"/></marker></defs>
<rect x="30" y="30" width="182" height="200" fill="none" stroke="#d9d5cb"/>
<text x="42" y="52" font-size="13" font-weight="700" fill="#8a4a40">Inflation</text>
<text x="42" y="68" font-size="11" fill="#5b646b">les prix montent</text>
<line x1="46" y1="160.7" x2="196" y2="160.7" stroke="#d9d5cb" stroke-dasharray="3 3"/>
<polyline points="46,160.7 61,156.0 76,151.1 91,146.1 106,141.0 121,135.7 136,130.2 151,124.6 166,118.8 181,112.8 196,106.7" fill="none" stroke="#8a4a40" stroke-width="2.2"/>
<text x="42" y="220" font-size="10.5" fill="#5b646b">niveau des prix sur 10 ans</text>
<rect x="230" y="30" width="182" height="200" fill="none" stroke="#d9d5cb"/>
<text x="242" y="52" font-size="13" font-weight="700" fill="#86672f">Désinflation</text>
<text x="242" y="68" font-size="11" fill="#5b646b">ils montent moins vite</text>
<line x1="246" y1="160.7" x2="396" y2="160.7" stroke="#d9d5cb" stroke-dasharray="3 3"/>
<polyline points="246,160.7 261,151.3 276,142.1 291,133.3 306,125.0 321,117.3 336,110.3 351,104.1 366,98.7 381,94.3 396,91.0" fill="none" stroke="#86672f" stroke-width="2.2"/>
<text x="242" y="220" font-size="10.5" fill="#5b646b">niveau des prix sur 10 ans</text>
<rect x="430" y="30" width="182" height="200" fill="none" stroke="#d9d5cb"/>
<text x="442" y="52" font-size="13" font-weight="700" fill="#284764">Déflation</text>
<text x="442" y="68" font-size="11" fill="#5b646b">ils baissent</text>
<line x1="446" y1="160.7" x2="596" y2="160.7" stroke="#d9d5cb" stroke-dasharray="3 3"/>
<polyline points="446,160.7 461,163.9 476,166.9 491,170.0 506,172.9 521,175.8 536,178.7 551,181.4 566,184.2 581,186.8 596,189.5" fill="none" stroke="#284764" stroke-width="2.2"/>
<text x="442" y="220" font-size="10.5" fill="#5b646b">niveau des prix sur 10 ans</text>
<text x="30" y="270" font-size="11" fill="#7b8389">La désinflation n'est pas une baisse des prix : ils continuent de monter, mais moins vite. Seule la déflation les fait baisser.</text>
</svg>
