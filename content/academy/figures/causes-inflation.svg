<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Les causes de l'inflation</title>
<desc id="d">Trois cases, la demande, les coûts et les anticipations, reliées par des flèches à une case centrale, la hausse générale des prix.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b646b"/></marker></defs>
<rect x="30" y="40" width="180" height="92" rx="3" fill="#fbfaf6" stroke="#3f6553" stroke-width="1.3"/>
<text x="120.0" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3f6553">Par la demande</text>
<text x="120.0" y="80" text-anchor="middle" font-size="10.8" fill="#5b646b">dépenses supérieures</text>
<text x="120.0" y="94" text-anchor="middle" font-size="10.8" fill="#5b646b">à ce que l'économie</text>
<text x="120.0" y="108" text-anchor="middle" font-size="10.8" fill="#5b646b">peut produire</text>
<rect x="230" y="40" width="180" height="92" rx="3" fill="#fbfaf6" stroke="#8a4a40" stroke-width="1.3"/>
<text x="320.0" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a4a40">Par les coûts</text>
<text x="320.0" y="80" text-anchor="middle" font-size="10.8" fill="#5b646b">énergie, matières,</text>
<text x="320.0" y="94" text-anchor="middle" font-size="10.8" fill="#5b646b">salaires, importations,</text>
<text x="320.0" y="108" text-anchor="middle" font-size="10.8" fill="#5b646b">ruptures d'approvisionnement</text>
<rect x="430" y="40" width="180" height="92" rx="3" fill="#fbfaf6" stroke="#86672f" stroke-width="1.3"/>
<text x="520.0" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#86672f">Par les anticipations</text>
<text x="520.0" y="80" text-anchor="middle" font-size="10.8" fill="#5b646b">prix et salaires fixés</text>
<text x="520.0" y="94" text-anchor="middle" font-size="10.8" fill="#5b646b">en fonction de</text>
<text x="520.0" y="108" text-anchor="middle" font-size="10.8" fill="#5b646b">l'inflation attendue</text>
<rect x="230" y="186" width="180" height="58" rx="3" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.3"/>
<text x="320.0" y="208" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2733">Hausse des prix</text>
<text x="320.0" y="226" text-anchor="middle" font-size="10.8" fill="#5b646b">générale et durable</text>
<line x1="120" y1="132" x2="268" y2="186" stroke="#5b646b" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="320" y1="132" x2="320" y2="186" stroke="#5b646b" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="520" y1="132" x2="372" y2="186" stroke="#5b646b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="30" y="276" font-size="11" fill="#7b8389">Trois familles d'explications, qui se combinent : un même épisode mêle souvent demande, coûts et anticipations.</text>
</svg>
