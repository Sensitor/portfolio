<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Trois façons de traiter une publication</title>
<desc id="d">Une publication d'importance élevée laisse trois choix : rester à l'écart, réduire la taille sur un stop élargi, ou attendre 15 à 30 minutes puis appliquer la méthode habituelle.</desc>
<rect x="200" y="20" width="240" height="44" rx="4" fill="#1b2733"/>
<text x="320" y="47" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fbfaf6">Publication d'importance élevée</text>
<path d="M320 64 L320 84 L115 84 L115 104" fill="none" stroke="#d9d5cb" stroke-width="1.6"/>
<rect x="20" y="104" width="190" height="130" rx="4" fill="#fbfaf6" stroke="#5b646b" stroke-width="1.6"/>
<rect x="20" y="104" width="190" height="5" fill="#5b646b"/>
<text x="115" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#5b646b">Rester à l'écart</text>
<text x="115" y="158" text-anchor="middle" font-size="12" fill="#1b2733">aucune position de</text>
<text x="115" y="175" text-anchor="middle" font-size="12" fill="#1b2733">quelques minutes avant</text>
<text x="115" y="192" text-anchor="middle" font-size="12" fill="#1b2733">à quelques minutes après</text>
<text x="115" y="222" text-anchor="middle" font-size="11" fill="#5b646b">coût : un mouvement manqué</text>
<path d="M320 64 L320 84 L322 84 L322 104" fill="none" stroke="#d9d5cb" stroke-width="1.6"/>
<rect x="227" y="104" width="190" height="130" rx="4" fill="#fbfaf6" stroke="#284764" stroke-width="1.6"/>
<rect x="227" y="104" width="190" height="5" fill="#284764"/>
<text x="322" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#284764">Réduire</text>
<text x="322" y="158" text-anchor="middle" font-size="12" fill="#1b2733">taille calculée sur</text>
<text x="322" y="175" text-anchor="middle" font-size="12" fill="#1b2733">un stop élargi,</text>
<text x="322" y="192" text-anchor="middle" font-size="12" fill="#1b2733">glissement compris</text>
<text x="322" y="222" text-anchor="middle" font-size="11" fill="#5b646b">coût : un gain plus petit</text>
<path d="M320 64 L320 84 L529 84 L529 104" fill="none" stroke="#d9d5cb" stroke-width="1.6"/>
<rect x="434" y="104" width="190" height="130" rx="4" fill="#fbfaf6" stroke="#3f6553" stroke-width="1.6"/>
<rect x="434" y="104" width="190" height="5" fill="#3f6553"/>
<text x="529" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#3f6553">Attendre la réaction</text>
<text x="529" y="158" text-anchor="middle" font-size="12" fill="#1b2733">15 à 30 minutes, puis</text>
<text x="529" y="175" text-anchor="middle" font-size="12" fill="#1b2733">la méthode habituelle</text>
<text x="529" y="192" text-anchor="middle" font-size="12" fill="#1b2733">sur la nouvelle structure</text>
<text x="529" y="222" text-anchor="middle" font-size="11" fill="#5b646b">coût : une entrée plus tardive</text>
<text x="320" y="262" text-anchor="middle" font-size="11.5" fill="#7b8389">Le choix se fait la veille, jamais dans la minute qui suit le chiffre.</text>
</svg>
