<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Order block</title>
<desc id="d">Cinq bougies sur GBPUSD. La deuxième balaie des creux égaux puis l'impulsion haussière casse un sommet de swing. La dernière bougie baissière avant l'impulsion est surlignée comme order block, et l'écart laissé par l'impulsion comme FVG.</desc>
