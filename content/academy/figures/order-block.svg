<text x="360" y="96.9" text-anchor="middle" font-size="10.5" fill="#5b646b">cassure en clôture</text>
<text x="40" y="282" font-size="11" fill="#7b8389">Convention du cours : dernière bougie baissière avant l'impulsion qui casse la structure, de son plus bas à son plus haut.</text>
