<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 275" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Les précurseurs de Bitcoin</title>
<desc id="d">Une frise de 1983 à 2009 : signatures aveugles de Chaum en 1983, horodatage chaîné de Haber et Stornetta en 1991, Hashcash d'Adam Back en 1997, b-money de Wei Dai en 1998, bit gold de Nick Szabo en 2005, livre blanc de Nakamoto en 2008, bloc de genèse le 3 janvier 2009.</desc>
<line x1="50" y1="150" x2="590" y2="150" stroke="#1b2733" stroke-width="1.6"/>
<line x1="124.5" y1="146" x2="124.5" y2="154" stroke="#1b2733"/>
<text x="124.5" y="172" font-size="10.5" fill="#5b646b" text-anchor="middle">1985</text>
<line x1="217.6" y1="146" x2="217.6" y2="154" stroke="#1b2733"/>
<text x="217.6" y="172" font-size="10.5" fill="#5b646b" text-anchor="middle">1990</text>
<line x1="310.7" y1="146" x2="310.7" y2="154" stroke="#1b2733"/>
<text x="310.7" y="172" font-size="10.5" fill="#5b646b" text-anchor="middle">1995</text>
<line x1="403.8" y1="146" x2="403.8" y2="154" stroke="#1b2733"/>
<text x="403.8" y="172" font-size="10.5" fill="#5b646b" text-anchor="middle">2000</text>
<line x1="496.9" y1="146" x2="496.9" y2="154" stroke="#1b2733"/>
<text x="496.9" y="172" font-size="10.5" fill="#5b646b" text-anchor="middle">2005</text>
<line x1="590.0" y1="146" x2="590.0" y2="154" stroke="#1b2733"/>
<text x="590.0" y="172" font-size="10.5" fill="#5b646b" text-anchor="middle">2010</text>
<circle cx="87.2" cy="150" r="5.5" fill="#284764"/>
<line x1="87.2" y1="144" x2="87.2" y2="88" stroke="#284764" stroke-dasharray="2 3"/>
<text x="87.2" y="48" font-size="12" fill="#284764" font-weight="700" text-anchor="middle">1983</text>
<text x="87.2" y="63" font-size="11.5" fill="#1b2733" font-weight="700" text-anchor="middle">Chaum</text>
<text x="87.2" y="78" font-size="11.5" fill="#5b646b" text-anchor="middle">signatures aveugles</text>
<circle cx="236.2" cy="150" r="5.5" fill="#284764"/>
<line x1="236.2" y1="156" x2="236.2" y2="184" stroke="#284764" stroke-dasharray="2 3"/>
<text x="236.2" y="200" font-size="12" fill="#284764" font-weight="700" text-anchor="middle">1991</text>
<text x="236.2" y="215" font-size="11.5" fill="#1b2733" font-weight="700" text-anchor="middle">Haber, Stornetta</text>
<text x="236.2" y="230" font-size="11.5" fill="#5b646b" text-anchor="middle">horodatage chaîné</text>
<circle cx="347.9" cy="150" r="5.5" fill="#284764"/>
<line x1="347.9" y1="144" x2="347.9" y2="88" stroke="#284764" stroke-dasharray="2 3"/>
<text x="347.9" y="48" font-size="12" fill="#284764" font-weight="700" text-anchor="middle">1997</text>
<text x="347.9" y="63" font-size="11.5" fill="#1b2733" font-weight="700" text-anchor="middle">Back</text>
<text x="347.9" y="78" font-size="11.5" fill="#5b646b" text-anchor="middle">Hashcash</text>
<circle cx="366.6" cy="150" r="5.5" fill="#284764"/>
<line x1="366.6" y1="156" x2="366.6" y2="184" stroke="#284764" stroke-dasharray="2 3"/>
<text x="366.6" y="200" font-size="12" fill="#284764" font-weight="700" text-anchor="middle">1998</text>
<text x="366.6" y="215" font-size="11.5" fill="#1b2733" font-weight="700" text-anchor="middle">Dai</text>
<text x="366.6" y="230" font-size="11.5" fill="#5b646b" text-anchor="middle">b-money</text>
<circle cx="496.9" cy="150" r="5.5" fill="#284764"/>
<line x1="496.9" y1="144" x2="496.9" y2="88" stroke="#284764" stroke-dasharray="2 3"/>
<text x="496.9" y="48" font-size="12" fill="#284764" font-weight="700" text-anchor="middle">2005</text>
<text x="496.9" y="63" font-size="11.5" fill="#1b2733" font-weight="700" text-anchor="middle">Szabo</text>
<text x="496.9" y="78" font-size="11.5" fill="#5b646b" text-anchor="middle">bit gold</text>
<circle cx="552.8" cy="150" r="5.5" fill="#9c4a1a"/>
<line x1="552.8" y1="144" x2="552.8" y2="88" stroke="#9c4a1a" stroke-dasharray="2 3"/>
<text x="548.8" y="48" font-size="12" fill="#9c4a1a" font-weight="700" text-anchor="start">2008</text>
<text x="548.8" y="63" font-size="11.5" fill="#1b2733" font-weight="700" text-anchor="start">Nakamoto</text>
<text x="548.8" y="78" font-size="11.5" fill="#5b646b" text-anchor="start">livre blanc</text>
<circle cx="571.4" cy="150" r="5.5" fill="#9c4a1a"/>
<line x1="571.4" y1="156" x2="571.4" y2="184" stroke="#9c4a1a" stroke-dasharray="2 3"/>
<text x="579.4" y="200" font-size="12" fill="#9c4a1a" font-weight="700" text-anchor="end">2009</text>
<text x="579.4" y="215" font-size="11.5" fill="#1b2733" font-weight="700" text-anchor="end">3 janvier</text>
<text x="579.4" y="230" font-size="11.5" fill="#5b646b" text-anchor="end">bloc de genèse</text>
<text x="30" y="262" font-size="11" fill="#7b8389" text-anchor="start">Les idées que le livre blanc de 2008 assemble existaient avant lui.</text>
</svg>
