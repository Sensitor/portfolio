<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Ce qui se passe autour d'une publication</title>
<desc id="d">Un achat à 1,0850 avec un stop à 20 pips : au moment de la publication, le spread s'élargit, le prix saute à 1,0806, le stop est exécuté à 32 pips, puis le marché remonte vers 1,0840 avant de se stabiliser.</desc>
<line x1="70" y1="40" x2="70" y2="250" stroke="#9aa3a8"/>
<line x1="70" y1="66.2" x2="610" y2="66.2" stroke="#d9d5cb" stroke-width=".8"/>
<text x="62" y="70.2" text-anchor="end" font-size="10.5" fill="#5b646b">1,0860</text>
<line x1="70" y1="118.7" x2="610" y2="118.7" stroke="#d9d5cb" stroke-width=".8"/>
<text x="62" y="122.7" text-anchor="end" font-size="10.5" fill="#5b646b">1,0840</text>
<line x1="70" y1="171.2" x2="610" y2="171.2" stroke="#d9d5cb" stroke-width=".8"/>
<text x="62" y="175.2" text-anchor="end" font-size="10.5" fill="#5b646b">1,0820</text>
<line x1="70" y1="223.7" x2="610" y2="223.7" stroke="#d9d5cb" stroke-width=".8"/>
<text x="62" y="227.7" text-anchor="end" font-size="10.5" fill="#5b646b">1,0800</text>
<polygon points="70.0,84.6 145.0,89.9 157.0,79.4 167.5,189.6 190.0,189.6 235.0,150.2 310.0,131.1 610.0,142.4 610.0,147.6 310.0,137.9 235.0,160.7 190.0,210.6 167.5,226.4 157.0,105.6 145.0,95.1 70.0,89.9" fill="#86672f" opacity=".18"/>
<line x1="160.0" y1="40" x2="160.0" y2="250" stroke="#1b2733" stroke-dasharray="4 4"/>
<text x="166.0" y="50.5" font-size="11.5" font-weight="700" fill="#1b2733">14 h 30 : publication</text>
<polyline points="70.0,87.3 100.0,95.1 130.0,89.9 157.0,92.5" fill="none" stroke="#284764" stroke-width="2.2"/>
<line x1="157.0" y1="92.5" x2="164.5" y2="208.0" stroke="#284764" stroke-width="1.6" stroke-dasharray="2 3"/>
<polyline points="164.5,208.0 175.0,192.3 197.5,200.1 235.0,155.5 280.0,116.1 325.0,137.1 385.0,129.3 460.0,147.6 535.0,139.8 610.0,145.0" fill="none" stroke="#284764" stroke-width="2.2"/>
<line x1="70" y1="145.0" x2="610" y2="145.0" stroke="#8a4a40" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="76.0" y="161.0" font-size="11.5" fill="#8a4a40">stop à 1,0830</text>
<circle cx="169.0" cy="176.5" r="5" fill="#8a4a40"/>
<text x="179.0" y="187.0" font-size="11.5" font-weight="700" fill="#8a4a40">exécuté à 32 pips</text>
<text x="76.0" y="71.5" font-size="11" fill="#284764">entrée à 1,0850</text>
<text x="178.0" y="231.6" font-size="11" fill="#5b646b">saut de prix, carnet vide</text>
<text x="295.0" y="97.7" font-size="11" fill="#5b646b">aller-retour</text>
<rect x="385.0" y="236.4" width="12" height="10" fill="#86672f" opacity=".3"/><text x="403.0" y="245.4" font-size="11" fill="#5b646b">spread, élargi au moment du chiffre</text>
<text x="85.0" y="268.0" text-anchor="middle" font-size="10.5" fill="#5b646b">−5 min</text>
<text x="160.0" y="268.0" text-anchor="middle" font-size="10.5" fill="#5b646b">0</text>
<text x="310.0" y="268.0" text-anchor="middle" font-size="10.5" fill="#5b646b">+10 min</text>
<text x="460.0" y="268.0" text-anchor="middle" font-size="10.5" fill="#5b646b">+20 min</text>
<text x="610.0" y="268.0" text-anchor="middle" font-size="10.5" fill="#5b646b">+30 min</text>
<text x="30" y="294" font-size="11" fill="#7b8389">Schéma : prix construits pour l'illustration, achat d'EURUSD conservé pendant une publication.</text>
</svg>
