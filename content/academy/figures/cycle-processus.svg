<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Le cycle d'un processus de trading</title>
<desc id="d">Cinq étapes en cycle : le plan, des règles écrites et datées ; la préparation, des scénarios et leurs invalidations ; l'exécution, seulement des trades conformes ; le journal, le résultat en R et le respect des règles ; la revue, qui ne change qu'une règle à la fois et nourrit le plan suivant.</desc>
<line x1="386.5" y1="66.6" x2="453.5" y2="93.4" stroke="#7b8389" stroke-width="1.6"/><path d="M444.5 94.0 L453.5 93.4 L447.4 86.8" fill="none" stroke="#7b8389" stroke-width="1.6"/>
<line x1="502.5" y1="150.0" x2="467.5" y2="210.0" stroke="#7b8389" stroke-width="1.6"/><path d="M468.2 201.0 L467.5 210.0 L475.0 204.9" fill="none" stroke="#7b8389" stroke-width="1.6"/>
<line x1="363.0" y1="240.0" x2="277.0" y2="240.0" stroke="#7b8389" stroke-width="1.6"/><path d="M285.1 236.1 L277.0 240.0 L285.1 243.9" fill="none" stroke="#7b8389" stroke-width="1.6"/>
<line x1="172.5" y1="210.0" x2="137.5" y2="150.0" stroke="#7b8389" stroke-width="1.6"/><path d="M145.0 155.1 L137.5 150.0 L138.2 159.0" fill="none" stroke="#7b8389" stroke-width="1.6"/>
<line x1="186.5" y1="93.4" x2="253.5" y2="66.6" stroke="#7b8389" stroke-width="1.6"/><path d="M247.4 73.2 L253.5 66.6 L244.5 66.0" fill="none" stroke="#7b8389" stroke-width="1.6"/>
<rect x="240" y="16" width="160" height="48" rx="4" fill="#fbfaf6" stroke="#284764" stroke-width="1.5"/>
<text x="320" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">1. Plan</text>
<text x="320" y="53" text-anchor="middle" font-size="10.5" fill="#5b646b">règles écrites et datées</text>
<rect x="440" y="96" width="160" height="48" rx="4" fill="#fbfaf6" stroke="#284764" stroke-width="1.5"/>
<text x="520" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">2. Préparation</text>
<text x="520" y="133" text-anchor="middle" font-size="10.5" fill="#5b646b">scénarios et invalidations</text>
<rect x="370" y="216" width="160" height="48" rx="4" fill="#fbfaf6" stroke="#284764" stroke-width="1.5"/>
<text x="450" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">3. Exécution</text>
<text x="450" y="253" text-anchor="middle" font-size="10.5" fill="#5b646b">trades conformes seulement</text>
<rect x="110" y="216" width="160" height="48" rx="4" fill="#fbfaf6" stroke="#284764" stroke-width="1.5"/>
<text x="190" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">4. Journal</text>
<text x="190" y="253" text-anchor="middle" font-size="10.5" fill="#5b646b">résultat en R, règles oui ou non</text>
<rect x="40" y="96" width="160" height="48" rx="4" fill="#fbfaf6" stroke="#284764" stroke-width="1.5"/>
<text x="120" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">5. Revue</text>
<text x="120" y="133" text-anchor="middle" font-size="10.5" fill="#5b646b">une règle à la fois</text>
<text x="320" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#284764">Le processus</text>
<text x="320" y="158" text-anchor="middle" font-size="10.5" fill="#5b646b">jugé sur ce que l'on contrôle</text>
<text x="30" y="292" font-size="11" fill="#7b8389">Chaque revue nourrit la version suivante du plan ; le cycle recommence à chaque séance.</text>
</svg>
