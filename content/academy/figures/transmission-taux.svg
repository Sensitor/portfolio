<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">La transmission du taux directeur</title>
<desc id="d">Cinq étapes en chaîne : taux directeur, taux du marché interbancaire, taux des crédits, demande, puis prix et emploi.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b646b"/></marker></defs>
<rect x="18" y="96" width="112" height="64" rx="3" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.3"/>
<text x="74.0" y="128.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1b2733">Taux directeur</text>
<text x="74" y="182" text-anchor="middle" font-size="10.5" fill="#5b646b">fixé par la</text>
<text x="74" y="196" text-anchor="middle" font-size="10.5" fill="#5b646b">banque centrale</text>
<line x1="130" y1="128" x2="140" y2="128" stroke="#5b646b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="142" y="96" width="112" height="64" rx="3" fill="#fbfaf6" stroke="#284764" stroke-width="1.3"/>
<text x="198.0" y="128.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1b2733">Taux du marché</text>
<text x="198" y="182" text-anchor="middle" font-size="10.5" fill="#5b646b">entre banques,</text>
<text x="198" y="196" text-anchor="middle" font-size="10.5" fill="#5b646b">au jour le jour</text>
<line x1="254" y1="128" x2="264" y2="128" stroke="#5b646b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="266" y="96" width="112" height="64" rx="3" fill="#fbfaf6" stroke="#284764" stroke-width="1.3"/>
<text x="322.0" y="128.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1b2733">Taux des crédits</text>
<text x="322" y="182" text-anchor="middle" font-size="10.5" fill="#5b646b">ménages,</text>
<text x="322" y="196" text-anchor="middle" font-size="10.5" fill="#5b646b">entreprises, État</text>
<line x1="378" y1="128" x2="388" y2="128" stroke="#5b646b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="390" y="96" width="112" height="64" rx="3" fill="#fbfaf6" stroke="#3f6553" stroke-width="1.3"/>
<text x="446.0" y="128.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1b2733">Demande</text>
<text x="446" y="182" text-anchor="middle" font-size="10.5" fill="#5b646b">crédit, achats,</text>
<text x="446" y="196" text-anchor="middle" font-size="10.5" fill="#5b646b">investissement</text>
<line x1="502" y1="128" x2="512" y2="128" stroke="#5b646b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="514" y="96" width="112" height="64" rx="3" fill="#fbfaf6" stroke="#86672f" stroke-width="1.3"/>
<text x="570.0" y="128.0" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1b2733">Prix et emploi</text>
<text x="570" y="182" text-anchor="middle" font-size="10.5" fill="#5b646b">après plusieurs</text>
<text x="570" y="196" text-anchor="middle" font-size="10.5" fill="#5b646b">trimestres</text>
<text x="320" y="60" text-anchor="middle" font-size="12.5" fill="#1b2733">Une hausse du taux directeur renchérit le crédit, et freine la demande avec retard.</text>
<text x="30" y="282" font-size="11" fill="#7b8389">Chaîne simplifiée. Chaque maillon dépend aussi des anticipations, de la santé des banques et de la confiance.</text>
</svg>
