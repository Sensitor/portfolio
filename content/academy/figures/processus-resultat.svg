<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Décision et résultat</title>
<desc id="d">Une grille de deux lignes et deux colonnes : règles suivies ou non, gain ou perte. Les quatre cases sont qualifiées : mérité, normal, chance, prévisible.</desc>
<text x="380" y="34" text-anchor="middle" font-size="12" fill="#5b646b">résultat du trade</text>
<text x="268" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2733">Gain</text>
<text x="500" y="56" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2733">Perte</text>
<text x="24" y="114" font-size="12.5" font-weight="700" fill="#1b2733">Règles</text>
<text x="24" y="130" font-size="12.5" font-weight="700" fill="#1b2733">suivies</text>
<text x="24" y="208" font-size="12.5" font-weight="700" fill="#1b2733">Règles</text>
<text x="24" y="224" font-size="12.5" font-weight="700" fill="#1b2733">non suivies</text>
<rect x="150" y="68" width="228" height="84" rx="3" fill="#3f6553" opacity=".10" stroke="#3f6553"/>
<text x="164" y="98" font-size="12.5" font-weight="700" fill="#3f6553">Bonne décision, gain</text>
<text x="164" y="120" font-size="12" fill="#1b2733">Mérité. À reproduire.</text>
<rect x="390" y="68" width="228" height="84" rx="3" fill="#284764" opacity=".10" stroke="#284764"/>
<text x="404" y="98" font-size="12.5" font-weight="700" fill="#284764">Bonne décision, perte</text>
<text x="404" y="120" font-size="12" fill="#1b2733">Normal. Le plan reste bon.</text>
<rect x="150" y="162" width="228" height="84" rx="3" fill="#8a4a40" opacity=".10" stroke="#8a4a40"/>
<text x="164" y="192" font-size="12.5" font-weight="700" fill="#8a4a40">Mauvaise décision, gain</text>
<text x="164" y="214" font-size="12" fill="#1b2733">Chance. Le plus dangereux :</text>
<text x="164" y="232" font-size="12" fill="#1b2733">il renforce l'erreur.</text>
<rect x="390" y="162" width="228" height="84" rx="3" fill="#86672f" opacity=".10" stroke="#86672f"/>
<text x="404" y="192" font-size="12.5" font-weight="700" fill="#86672f">Mauvaise décision, perte</text>
<text x="404" y="214" font-size="12" fill="#1b2733">Prévisible. À corriger.</text>
<text x="40" y="282" font-size="11" fill="#7b8389">Un trade se juge sur la décision, prise avec ce que l'on savait alors. Le résultat d'un seul trade dit peu de chose.</text>
</svg>
