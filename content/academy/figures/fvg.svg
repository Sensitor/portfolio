<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Fair Value Gap</title>
<desc id="d">Deux schémas de trois bougies. À gauche, un écart haussier entre le haut de la bougie 1 et le bas de la bougie 3 ; à droite, l'écart baissier symétrique. Le milieu de chaque écart est tracé en pointillé.</desc>
<rect x="40" y="20" width="290" height="240" fill="none" stroke="#d9d5cb"/>
<text x="54" y="42" font-size="13" font-weight="700" fill="#1b2733">FVG haussier</text>
<rect x="60" y="141.2" width="262" height="30.4" fill="#86672f" opacity=".18"/>
<line x1="60" y1="156.4" x2="322" y2="156.4" stroke="#86672f" stroke-dasharray="4 3"/>
<line x1="76" y1="171.6" x2="76" y2="217.2" stroke="#1b2733" stroke-width="1.3"/>
<rect x="67.0" y="179.2" width="18" height="22.8" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.3"/>
<line x1="114" y1="95.6" x2="114" y2="186.8" stroke="#1b2733" stroke-width="1.3"/>
<rect x="105.0" y="103.2" width="18" height="76.0" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.3"/>
<line x1="152" y1="72.8" x2="152" y2="141.2" stroke="#1b2733" stroke-width="1.3"/>
<rect x="143.0" y="80.4" width="18" height="22.8" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.3"/>
<text x="322" y="136.2" text-anchor="end" font-size="11" fill="#5b646b">bas de la bougie 3</text>
<text x="322" y="185.6" text-anchor="end" font-size="11" fill="#5b646b">haut de la bougie 1</text>
<text x="190" y="152.4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#86672f">FVG</text>
<text x="322" y="169.4" text-anchor="end" font-size="10.5" fill="#86672f">milieu</text>
<text x="76" y="252" text-anchor="middle" font-size="11" fill="#5b646b">1</text><text x="114" y="252" text-anchor="middle" font-size="11" fill="#5b646b">2</text><text x="152" y="252" text-anchor="middle" font-size="11" fill="#5b646b">3</text>
<rect x="350" y="20" width="290" height="240" fill="none" stroke="#d9d5cb"/>
<text x="364" y="42" font-size="13" font-weight="700" fill="#1b2733">FVG baissier</text>
<rect x="370" y="110.8" width="262" height="30.4" fill="#86672f" opacity=".18"/>
<line x1="370" y1="126.0" x2="632" y2="126.0" stroke="#86672f" stroke-dasharray="4 3"/>
<line x1="386" y1="65.2" x2="386" y2="110.8" stroke="#1b2733" stroke-width="1.3"/>
<rect x="377.0" y="80.4" width="18" height="22.8" fill="#3b4a57" stroke="#1b2733" stroke-width="1.3"/>
<line x1="424" y1="95.6" x2="424" y2="186.8" stroke="#1b2733" stroke-width="1.3"/>
<rect x="415.0" y="103.2" width="18" height="76.0" fill="#3b4a57" stroke="#1b2733" stroke-width="1.3"/>
<line x1="462" y1="141.2" x2="462" y2="209.6" stroke="#1b2733" stroke-width="1.3"/>
<rect x="453.0" y="179.2" width="18" height="22.8" fill="#3b4a57" stroke="#1b2733" stroke-width="1.3"/>
<text x="632" y="105.8" text-anchor="end" font-size="11" fill="#5b646b">bas de la bougie 1</text>
<text x="632" y="155.2" text-anchor="end" font-size="11" fill="#5b646b">haut de la bougie 3</text>
<text x="500" y="122.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#86672f">FVG</text>
<text x="632" y="139.0" text-anchor="end" font-size="10.5" fill="#86672f">milieu</text>
<text x="386" y="252" text-anchor="middle" font-size="11" fill="#5b646b">1</text><text x="424" y="252" text-anchor="middle" font-size="11" fill="#5b646b">2</text><text x="462" y="252" text-anchor="middle" font-size="11" fill="#5b646b">3</text>
<text x="40" y="282" font-size="11" fill="#7b8389">Trois bougies : la deuxième se déplace si vite que les mèches de la première et de la troisième ne se rejoignent pas.</text>
</svg>
