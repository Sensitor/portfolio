<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Trois unités de temps, trois lectures</title>
<desc id="d">Trois panneaux : en H4 une tendance haussière, en H1 une correction baissière dans cette tendance, en M15 un premier changement de structure haussier.</desc>
<rect x="20" y="20" width="190" height="230" fill="#fbfaf6" stroke="#d9d5cb"/>
<text x="34" y="44" font-size="13" font-weight="700" fill="#1b2733">H4 · le contexte</text>
<text x="34" y="61" font-size="11.5" fill="#5b646b">tendance haussière</text>
<polyline points="35,206.0 65,158.0 90,178.8 125,118.0 150,142.0 190,89.2" fill="none" stroke="#284764" stroke-width="2" stroke-linejoin="round"/>
<rect x="138" y="114.8" width="34" height="35.2" fill="#284764" opacity=".12"/>
<rect x="225" y="20" width="190" height="230" fill="#fbfaf6" stroke="#d9d5cb"/>
<text x="239" y="44" font-size="13" font-weight="700" fill="#1b2733">H1 · la structure</text>
<text x="239" y="61" font-size="11.5" fill="#5b646b">correction en cours</text>
<polyline points="240,89.2 270,130.8 295,111.6 330,156.4 355,137.2 395,175.6" fill="none" stroke="#284764" stroke-width="2" stroke-linejoin="round"/>
<rect x="430" y="20" width="190" height="230" fill="#fbfaf6" stroke="#d9d5cb"/>
<text x="444" y="44" font-size="13" font-weight="700" fill="#1b2733">M15 · le déclenchement</text>
<text x="444" y="61" font-size="11.5" fill="#5b646b">premier MSS haussier</text>
<polyline points="445,118.0 470,166.0 492,146.8 518,194.8 542,159.6 570,172.4 600,114.8" fill="none" stroke="#284764" stroke-width="2" stroke-linejoin="round"/>
<line x1="542" y1="146.8" x2="615" y2="146.8" stroke="#3f6553" stroke-dasharray="4 4"/><text x="550" y="140.8" font-size="11" fill="#3f6553">MSS</text>
<path d="M212 135 l8 0 m-4 -4 l4 4 -4 4" stroke="#5b646b" fill="none"/><path d="M417 135 l8 0 m-4 -4 l4 4 -4 4" stroke="#5b646b" fill="none"/>
<text x="20" y="280" font-size="11" fill="#7b8389">La zone surlignée en H4 est détaillée en H1, puis en M15. Chaque unité de temps a sa propre structure ; aucune ne « gagne ».</text>
</svg>
