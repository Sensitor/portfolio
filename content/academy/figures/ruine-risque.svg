<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Risque de ruine selon le risque par trade</title>
<desc id="d">Diagramme en barres : pour chaque risque par trade, de 0,5 % à 5 %, la probabilité de perdre 20 % du capital initial en 200 trades, pour trois taux de réussite. Elle croît fortement avec le risque par trade.</desc>
<g stroke="#d9d5cb"><line x1="80" y1="230.0" x2="610" y2="230.0"/><line x1="80" y1="182.5" x2="610" y2="182.5"/><line x1="80" y1="135.0" x2="610" y2="135.0"/><line x1="80" y1="87.5" x2="610" y2="87.5"/><line x1="80" y1="40.0" x2="610" y2="40.0"/></g>
<text x="72" y="234.0" text-anchor="end" font-size="11" fill="#5b646b">0 %</text><text x="72" y="186.5" text-anchor="end" font-size="11" fill="#5b646b">25 %</text><text x="72" y="139.0" text-anchor="end" font-size="11" fill="#5b646b">50 %</text><text x="72" y="91.5" text-anchor="end" font-size="11" fill="#5b646b">75 %</text><text x="72" y="44.0" text-anchor="end" font-size="11" fill="#5b646b">100 %</text>
<rect x="100" y="230.0" width="22" height="0.0" fill="#3f6553" opacity=".85"/>
<rect x="126" y="228.2" width="22" height="1.8" fill="#86672f" opacity=".85"/>
<rect x="152" y="209.1" width="22" height="20.9" fill="#8a4a40" opacity=".85"/>
<text x="137.0" y="248" text-anchor="middle" font-size="11" fill="#5b646b">0,5 %</text>
<rect x="204" y="226.5" width="22" height="3.5" fill="#3f6553" opacity=".85"/>
<rect x="230" y="190.6" width="22" height="39.4" fill="#86672f" opacity=".85"/>
<rect x="256" y="114.6" width="22" height="115.4" fill="#8a4a40" opacity=".85"/>
<text x="241.0" y="248" text-anchor="middle" font-size="11" fill="#5b646b">1 %</text>
<rect x="308" y="199.6" width="22" height="30.4" fill="#3f6553" opacity=".85"/>
<rect x="334" y="123.8" width="22" height="106.2" fill="#86672f" opacity=".85"/>
<rect x="360" y="62.6" width="22" height="167.4" fill="#8a4a40" opacity=".85"/>
<text x="345.0" y="248" text-anchor="middle" font-size="11" fill="#5b646b">2 %</text>
<rect x="412" y="170.7" width="22" height="59.3" fill="#3f6553" opacity=".85"/>
<rect x="438" y="93.3" width="22" height="136.7" fill="#86672f" opacity=".85"/>
<rect x="464" y="50.9" width="22" height="179.1" fill="#8a4a40" opacity=".85"/>
<text x="449.0" y="248" text-anchor="middle" font-size="11" fill="#5b646b">3 %</text>
<rect x="516" y="129.2" width="22" height="100.8" fill="#3f6553" opacity=".85"/>
<rect x="542" y="66.4" width="22" height="163.6" fill="#86672f" opacity=".85"/>
<rect x="568" y="43.8" width="22" height="186.2" fill="#8a4a40" opacity=".85"/>
<text x="553.0" y="248" text-anchor="middle" font-size="11" fill="#5b646b">5 %</text>
<rect x="90" y="20" width="10" height="10" fill="#3f6553"/><text x="105" y="29" font-size="11.5" fill="#1b2733">45 % de réussite</text>
<rect x="265" y="20" width="10" height="10" fill="#86672f"/><text x="280" y="29" font-size="11.5" fill="#1b2733">40 % (espérance nulle)</text>
<rect x="440" y="20" width="10" height="10" fill="#8a4a40"/><text x="455" y="29" font-size="11.5" fill="#1b2733">36 %</text>
<text x="80" y="272" font-size="11" fill="#7b8389">Probabilité de perdre 20 % du capital de départ en 200 trades. Gains à 1,5R, trades indépendants.</text>
