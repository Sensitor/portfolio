<title id="t">Prix d'une obligation et taux du marché</title>
<desc id="d">Une courbe décroissante : le prix d'une obligation de 100 à coupon de 3 % sur 10 ans vaut 108,98 si le taux du marché est de 2 %, 100 à 3 % et 91,89 à 4 %.</desc>
