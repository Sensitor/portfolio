<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Le chiffre publié et le consensus</title>
<desc id="d">Trois publications avec un consensus de 150 000 emplois : publiées à 150 000, aucune surprise ; à 250 000, surprise de +100 000 ; à 40 000, surprise de −110 000.</desc>
<text x="120" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">Publié : +150 000</text>
<line x1="40" y1="236" x2="200" y2="236" stroke="#d9d5cb"/>
<rect x="95" y="143.0" width="50" height="93.0" fill="#5b646b" opacity=".85"/>
<line x1="50" y1="143.0" x2="190" y2="143.0" stroke="#1b2733" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="120" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b646b">Aucune surprise</text>
<text x="320" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">Publié : +250 000</text>
<line x1="240" y1="236" x2="400" y2="236" stroke="#d9d5cb"/>
<rect x="295" y="81.0" width="50" height="155.0" fill="#284764" opacity=".85"/>
<line x1="250" y1="143.0" x2="390" y2="143.0" stroke="#1b2733" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="365" y1="143.0" x2="365" y2="81.0" stroke="#284764" stroke-width="2"/>
<path d="M360 87.0 L365 81.0 L370 87.0" fill="none" stroke="#284764" stroke-width="2"/>
<text x="320" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#284764">Surprise : +100 000</text>
<text x="520" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2733">Publié : +40 000</text>
<line x1="440" y1="236" x2="600" y2="236" stroke="#d9d5cb"/>
<rect x="495" y="211.2" width="50" height="24.8" fill="#8a4a40" opacity=".85"/>
<line x1="450" y1="143.0" x2="590" y2="143.0" stroke="#1b2733" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="565" y1="143.0" x2="565" y2="211.2" stroke="#8a4a40" stroke-width="2"/>
<path d="M560 205.2 L565 211.2 L570 205.2" fill="none" stroke="#8a4a40" stroke-width="2"/>
<text x="520" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a4a40">Surprise : −110 000</text>
<text x="40" y="135.0" font-size="10.5" fill="#1b2733">consensus +150 000</text>
<text x="30" y="290" font-size="11" fill="#7b8389">Emplois créés dans le mois. Le prix contenait déjà le consensus : seul l'écart avec lui apporte une information.</text>
</svg>
