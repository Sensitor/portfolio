<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Le trade de revanche</title>
<desc id="d">Deux courbes de capital après trois pertes à 1 % : la quatrième perte à 1 % mène à 9 605,96 $, la même perte à 3 % mène à 9 411,90 $.</desc>
<line x1="90" y1="54.3" x2="600" y2="54.3" stroke="#d9d5cb"/>
<text x="82" y="229.7" text-anchor="end" font-size="10.5" fill="#5b646b">9 400</text>
<text x="82" y="172.6" text-anchor="end" font-size="10.5" fill="#5b646b">9 600</text>
<text x="82" y="115.4" text-anchor="end" font-size="10.5" fill="#5b646b">9 800</text>
<text x="82" y="58.3" text-anchor="end" font-size="10.5" fill="#5b646b">10 000</text>
<text x="100" y="258" text-anchor="middle" font-size="11" fill="#5b646b">départ</text>
<text x="210" y="258" text-anchor="middle" font-size="11" fill="#5b646b">perte 1</text>
<text x="320" y="258" text-anchor="middle" font-size="11" fill="#5b646b">perte 2</text>
<text x="430" y="258" text-anchor="middle" font-size="11" fill="#5b646b">perte 3</text>
<text x="540" y="258" text-anchor="middle" font-size="11" fill="#5b646b">perte 4</text>
<polyline points="100,54.3 210,82.9 320,111.1 430,139.1 540,166.9" fill="none" stroke="#284764" stroke-width="2.2"/>
<polyline points="430,139.1 540,222.3" fill="none" stroke="#8a4a40" stroke-width="2.2" stroke-dasharray="6 4"/>
<circle cx="540" cy="166.9" r="4" fill="#284764"/><circle cx="540" cy="222.3" r="4" fill="#8a4a40"/>
<text x="550" y="170.9" font-size="11.5" fill="#284764">9 605,96 à 1 %</text>
<text x="550" y="226.3" font-size="11.5" fill="#8a4a40">9 411,90 à 3 %</text>
<text x="40" y="282" font-size="11" fill="#7b8389">Après trois pertes à 1 %, le trade « pour se refaire » à 3 % fait passer le drawdown de 2,97 % à 5,88 % s'il est perdu.</text>
</svg>
