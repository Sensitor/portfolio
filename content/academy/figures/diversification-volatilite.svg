<text x="114.0" y="208.1" font-size="11" fill="#8a4a40">5 % : volatilité 15,1 % au lieu de 15 %</text>
<text x="80" y="28" font-size="12" fill="#1b2733">Volatilité d'un portefeuille selon la part d'un actif très volatil (60 %) à côté d'un actif à 15 %</text>
<text x="320" y="274" text-anchor="middle" font-size="10.5" fill="#5b646b">part de l'actif volatil</text>
<text x="30" y="290" font-size="11" fill="#7b8389">Calcul exact. Les volatilités et les corrélations sont des hypothèses : elles changent dans le temps, surtout en crise.</text>
</svg>
