<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Diversification et volatilité</title>
<desc id="d">Deux courbes de la volatilité d'un portefeuille selon la part d'un actif très volatil : avec une corrélation faible, 5 % de cet actif ne fait passer la volatilité que de 15 à 15,1 %.</desc>
