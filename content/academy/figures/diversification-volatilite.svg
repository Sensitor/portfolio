<text x="72" y="178.8" text-anchor="end" font-size="10.5" fill="#5b646b">20 %</text>
<line x1="80" y1="143.2" x2="560" y2="143.2" stroke="#d9d5cb"/>
<text x="72" y="147.2" text-anchor="end" font-size="10.5" fill="#5b646b">30 %</text>
<line x1="80" y1="111.5" x2="560" y2="111.5" stroke="#d9d5cb"/>
<text x="72" y="115.5" text-anchor="end" font-size="10.5" fill="#5b646b">40 %</text>
<line x1="80" y1="79.9" x2="560" y2="79.9" stroke="#d9d5cb"/>
<text x="72" y="83.9" text-anchor="end" font-size="10.5" fill="#5b646b">50 %</text>
<line x1="80" y1="48.3" x2="560" y2="48.3" stroke="#d9d5cb"/>
<text x="72" y="52.3" text-anchor="end" font-size="10.5" fill="#5b646b">60 %</text>
<text x="80.0" y="256" text-anchor="middle" font-size="10.5" fill="#5b646b">0 %</text>
<text x="200.0" y="256" text-anchor="middle" font-size="10.5" fill="#5b646b">25 %</text>
<text x="320.0" y="256" text-anchor="middle" font-size="10.5" fill="#5b646b">50 %</text>
<text x="440.0" y="256" text-anchor="middle" font-size="10.5" fill="#5b646b">75 %</text>
<text x="560.0" y="256" text-anchor="middle" font-size="10.5" fill="#5b646b">100 %</text>
