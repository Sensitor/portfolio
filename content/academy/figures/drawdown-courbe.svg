<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Courbe de capital et drawdown</title>
<desc id="d">Le capital passe de 10 000 dollars à un sommet de 10 199 dollars après le trade 3, puis descend jusqu'à 9 845 dollars après le trade 9 : un drawdown de 3,47 %.</desc>
<g stroke="#d9d5cb"><line x1="70" y1="230.0" x2="610" y2="230.0"/><line x1="70" y1="150.8" x2="610" y2="150.8"/><line x1="70" y1="71.7" x2="610" y2="71.7"/></g>
<text x="62" y="234.0" text-anchor="end" font-size="11" fill="#5b646b">9 800</text><text x="62" y="154.8" text-anchor="end" font-size="11" fill="#5b646b">10 000</text><text x="62" y="75.7" text-anchor="end" font-size="11" fill="#5b646b">10 200</text>
<rect x="194.6" y="72.1" width="249.2" height="140.3" fill="#8a4a40" opacity=".10"/>
<polyline points="70.0,150.8 111.5,111.2 153.1,151.2 194.6,72.1 236.2,112.4 277.7,152.4 319.2,192.0 360.8,133.2 402.3,173.0 443.8,212.3 485.4,134.4 526.9,54.9 568.5,95.5 610.0,55.3" fill="none" stroke="#284764" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="194.6" cy="72.1" r="4.5" fill="#284764"/>
<text x="194.6" y="62.1" text-anchor="middle" font-size="12" fill="#284764">sommet 10 199 $</text>
<circle cx="443.8" cy="212.3" r="4.5" fill="#8a4a40"/>
<text x="453.8" y="216.3" font-size="12" fill="#8a4a40">creux 9 845 $</text>
<text x="319.2" y="131.0" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4a40">drawdown −3,47 %</text>
<text x="70.0" y="250" text-anchor="middle" font-size="10" fill="#5b646b">0</text><text x="111.5" y="250" text-anchor="middle" font-size="10" fill="#5b646b">1</text><text x="153.1" y="250" text-anchor="middle" font-size="10" fill="#5b646b">2</text><text x="194.6" y="250" text-anchor="middle" font-size="10" fill="#5b646b">3</text><text x="236.2" y="250" text-anchor="middle" font-size="10" fill="#5b646b">4</text><text x="277.7" y="250" text-anchor="middle" font-size="10" fill="#5b646b">5</text><text x="319.2" y="250" text-anchor="middle" font-size="10" fill="#5b646b">6</text><text x="360.8" y="250" text-anchor="middle" font-size="10" fill="#5b646b">7</text><text x="402.3" y="250" text-anchor="middle" font-size="10" fill="#5b646b">8</text><text x="443.8" y="250" text-anchor="middle" font-size="10" fill="#5b646b">9</text><text x="485.4" y="250" text-anchor="middle" font-size="10" fill="#5b646b">10</text><text x="526.9" y="250" text-anchor="middle" font-size="10" fill="#5b646b">11</text><text x="568.5" y="250" text-anchor="middle" font-size="10" fill="#5b646b">12</text><text x="610.0" y="250" text-anchor="middle" font-size="10" fill="#5b646b">13</text>
<text x="70" y="272" font-size="11" fill="#7b8389">Treize trades, 1 % du capital risqué à chaque fois. Le drawdown se mesure du plus haut au plus bas qui le suit.</text>
</svg>
