<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Séries de pertes</title>
<desc id="d">Un histogramme : la probabilité d'au moins cinq pertes consécutives, à 50 % de réussite, passe de 10,9 % sur 10 trades à 96,6 % sur 200 trades.</desc>
<line x1="80" y1="236.0" x2="600" y2="236.0" stroke="#5b646b"/>
<line x1="80" y1="188.5" x2="600" y2="188.5" stroke="#d9d5cb"/>
<text x="72" y="192.5" text-anchor="end" font-size="10.5" fill="#5b646b">25 %</text>
<line x1="80" y1="141.0" x2="600" y2="141.0" stroke="#d9d5cb"/>
<text x="72" y="145.0" text-anchor="end" font-size="10.5" fill="#5b646b">50 %</text>
<line x1="80" y1="93.5" x2="600" y2="93.5" stroke="#d9d5cb"/>
<text x="72" y="97.5" text-anchor="end" font-size="10.5" fill="#5b646b">75 %</text>
<line x1="80" y1="46.0" x2="600" y2="46.0" stroke="#d9d5cb"/>
<text x="72" y="50.0" text-anchor="end" font-size="10.5" fill="#5b646b">100 %</text>
<rect x="120" y="215.2" width="52" height="20.8" fill="#284764" opacity=".8"/>
<text x="146" y="209.2" text-anchor="middle" font-size="12" font-weight="700" fill="#284764">10,9 %</text>
<text x="146" y="252.0" text-anchor="middle" font-size="11" fill="#5b646b">10 trades</text>
<rect x="220" y="188.5" width="52" height="47.5" fill="#284764" opacity=".8"/>
<text x="246" y="182.5" text-anchor="middle" font-size="12" font-weight="700" fill="#284764">25,0 %</text>
<text x="246" y="252.0" text-anchor="middle" font-size="11" fill="#5b646b">20 trades</text>
<rect x="320" y="131.1" width="52" height="104.9" fill="#284764" opacity=".8"/>
<text x="346" y="125.1" text-anchor="middle" font-size="12" font-weight="700" fill="#284764">55,2 %</text>
<text x="346" y="252.0" text-anchor="middle" font-size="11" fill="#5b646b">50 trades</text>
<rect x="420" y="82.1" width="52" height="153.9" fill="#284764" opacity=".8"/>
<text x="446" y="76.1" text-anchor="middle" font-size="12" font-weight="700" fill="#284764">81,0 %</text>
<text x="446" y="252.0" text-anchor="middle" font-size="11" fill="#5b646b">100 trades</text>
<rect x="520" y="52.5" width="52" height="183.5" fill="#284764" opacity=".8"/>
<text x="546" y="46.5" text-anchor="middle" font-size="12" font-weight="700" fill="#284764">96,6 %</text>
<text x="546" y="252.0" text-anchor="middle" font-size="11" fill="#5b646b">200 trades</text>
<text x="80" y="30" font-size="12" fill="#1b2733">Probabilité d'au moins 5 pertes d'affilée, à 50 % de réussite</text>
<text x="40" y="282" font-size="11" fill="#7b8389">Calcul exact, trades indépendants. Sur 200 trades, cinq pertes d'affilée sont presque certaines.</text>
</svg>
