<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">La règle des deux bougies</title>
<desc id="d">Sept bougies. Le plus haut de la bougie centrale dépasse ceux des deux bougies qui la précèdent et des deux qui la suivent : c'est un sommet de swing, confirmé à la clôture de la deuxième bougie suivante.</desc>
<g stroke="#d9d5cb"><line x1="60" y1="250" x2="600" y2="250"/></g>
<line x1="110" y1="171.2" x2="110" y2="230.3" stroke="#1b2733" stroke-width="1.3"/>
<rect x="101.0" y="184.4" width="18" height="26.2" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.3"/>
<line x1="180" y1="138.4" x2="180" y2="197.5" stroke="#1b2733" stroke-width="1.3"/>
<rect x="171.0" y="151.6" width="18" height="32.8" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.3"/>
<line x1="250" y1="118.8" x2="250" y2="171.2" stroke="#1b2733" stroke-width="1.3"/>
<rect x="241.0" y="151.6" width="18" height="13.1" fill="#3b4a57" stroke="#1b2733" stroke-width="1.3"/>
<line x1="320" y1="66.2" x2="320" y2="171.2" stroke="#1b2733" stroke-width="1.3"/>
<rect x="311.0" y="79.4" width="18" height="85.3" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.3"/>
<line x1="390" y1="72.8" x2="390" y2="138.4" stroke="#1b2733" stroke-width="1.3"/>
<rect x="381.0" y="79.4" width="18" height="45.9" fill="#3b4a57" stroke="#1b2733" stroke-width="1.3"/>
<line x1="460" y1="105.6" x2="460" y2="164.7" stroke="#1b2733" stroke-width="1.3"/>
<rect x="451.0" y="125.3" width="18" height="26.2" fill="#3b4a57" stroke="#1b2733" stroke-width="1.3"/>
<line x1="70" y1="66.2" x2="590" y2="66.2" stroke="#284764" stroke-dasharray="5 4" stroke-width="1.2"/>
<circle cx="320" cy="56.2" r="4.5" fill="#284764"/>
<text x="320" y="44.2" text-anchor="middle" font-size="13" font-weight="700" fill="#284764">Sommet de swing</text>
<path d="M160 275 H270" stroke="#5b646b" fill="none"/><text x="215.0" y="292" text-anchor="middle" font-size="12" fill="#5b646b">2 bougies avant</text><text x="215.0" y="306" text-anchor="middle" font-size="11" fill="#5b646b">plus hauts inférieurs</text>
<path d="M370 275 H480" stroke="#5b646b" fill="none"/><text x="425.0" y="292" text-anchor="middle" font-size="12" fill="#5b646b">2 bougies après</text><text x="425.0" y="306" text-anchor="middle" font-size="11" fill="#5b646b">plus hauts inférieurs</text>
<path d="M476 181.6 L464 163.6" stroke="#1b2733" fill="none"/><text x="480" y="195.6" font-size="11.5" fill="#1b2733">sommet confirmé à la</text><text x="480" y="210.6" font-size="11.5" fill="#1b2733">clôture de cette bougie</text>
<text x="60" y="330" font-size="11" fill="#7b8389">Le même raisonnement, inversé sur les plus bas, désigne un creux de swing. Schéma original, sans échelle de prix.</text>
</svg>
