<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Un range</title>
<desc id="d">Une ligne en zigzag oscille entre une zone haute et une zone basse horizontales, sans progression d'ensemble.</desc>
<rect x="40" y="46" width="570" height="24" fill="#a3564a" opacity=".12"/>
<rect x="40" y="176" width="570" height="24" fill="#4e7461" opacity=".14"/>
<text x="48" y="40" font-size="12" fill="#8a4a40">Zone haute</text>
<text x="48" y="218" font-size="12" fill="#3f6553">Zone basse</text>
<polyline points="50,150 110,60 170,188 240,55 300,182 370,62 430,190 500,58 560,180 600,120" fill="none" stroke="#284764" stroke-width="2.4" stroke-linejoin="round"/>
<text x="40" y="248" font-size="11" fill="#7b8389">Les sommets et les creux se répètent dans les mêmes zones : pas de sommets ni de creux plus hauts ou plus bas.</text>
</svg>
