<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Confluence de zones</title>
<desc id="d">Quatre zones de prix sur le même axe : la zone OTE, deux FVG et un order block. Seul le FVG inférieur recoupe la zone OTE, entre 1,2651 et 1,2664.</desc>
<rect x="80" y="171.7" width="520" height="22.5" fill="#8a4a40" opacity=".10"/>
<line x1="80" y1="171.7" x2="600" y2="171.7" stroke="#8a4a40" stroke-dasharray="4 3"/>
<line x1="80" y1="194.3" x2="600" y2="194.3" stroke="#8a4a40" stroke-dasharray="4 3"/>
<text x="72" y="234.7" text-anchor="end" font-size="10.5" fill="#5b646b">1,2630</text>
<line x1="76" y1="230.7" x2="80" y2="230.7" stroke="#5b646b"/>
<text x="72" y="200.0" text-anchor="end" font-size="10.5" fill="#5b646b">1,2650</text>
<line x1="76" y1="196.0" x2="80" y2="196.0" stroke="#5b646b"/>
<text x="72" y="165.3" text-anchor="end" font-size="10.5" fill="#5b646b">1,2670</text>
<line x1="76" y1="161.3" x2="80" y2="161.3" stroke="#5b646b"/>
<text x="72" y="130.7" text-anchor="end" font-size="10.5" fill="#5b646b">1,2690</text>
<line x1="76" y1="126.7" x2="80" y2="126.7" stroke="#5b646b"/>
<text x="72" y="96.0" text-anchor="end" font-size="10.5" fill="#5b646b">1,2710</text>
<line x1="76" y1="92.0" x2="80" y2="92.0" stroke="#5b646b"/>
<text x="72" y="61.3" text-anchor="end" font-size="10.5" fill="#5b646b">1,2730</text>
<line x1="76" y1="57.3" x2="80" y2="57.3" stroke="#5b646b"/>
<line x1="80" y1="40" x2="80" y2="248" stroke="#5b646b"/>
<rect x="130" y="164.8" width="56" height="29.5" fill="#86672f" opacity=".35" stroke="#86672f"/>
<text x="158" y="156.8" text-anchor="middle" font-size="11" fill="#86672f">OTE 62 à 79 %</text>
<rect x="250" y="171.7" width="56" height="24.3" fill="#284764" opacity=".35" stroke="#284764"/>
<text x="278" y="163.7" text-anchor="middle" font-size="11" fill="#284764">FVG inférieur</text>
<rect x="370" y="126.7" width="56" height="32.9" fill="#284764" opacity=".35" stroke="#284764"/>
<text x="398" y="118.7" text-anchor="middle" font-size="11" fill="#284764">FVG supérieur</text>
<rect x="490" y="196.0" width="56" height="34.7" fill="#3f6553" opacity=".35" stroke="#3f6553"/>
<text x="518" y="246.7" text-anchor="middle" font-size="11" fill="#3f6553">Order block</text>
<text x="596" y="165.7" text-anchor="end" font-size="11.5" font-weight="700" fill="#8a4a40">chevauchement 1,2651 à 1,2664</text>
<text x="40" y="282" font-size="11" fill="#7b8389">Seul le FVG inférieur recoupe la zone OTE ; l'order block reste dessous, le FVG supérieur au-dessus.</text>
</svg>
