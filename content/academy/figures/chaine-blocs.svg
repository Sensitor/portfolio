<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Les blocs chaînés par leurs empreintes</title>
<desc id="d">Trois blocs, chacun contenant l'empreinte du précédent. Quand une transaction du bloc 2 est modifiée, son empreinte change ; le bloc 3 contient encore l'ancienne, et le lien entre les deux est rompu.</desc>
<text x="30" y="30" font-size="12.5" fill="#284764" font-weight="700" text-anchor="start">Chaîne d'origine</text>
<rect x="30" y="42" width="180" height="92" rx="4" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.4"/>
<text x="42" y="62" font-size="12" fill="#1b2733" font-weight="700" text-anchor="start">Bloc 1</text>
<text x="42" y="80" font-size="10.5" fill="#5b646b" text-anchor="start" font-family="DM Mono, Menlo, monospace">précédent : 0000000000…</text>
<text x="42" y="98" font-size="11.5" fill="#1b2733" text-anchor="start">Alice paie Bob</text>
<text x="42" y="120" font-size="10.5" fill="#284764" font-weight="700" text-anchor="start" font-family="DM Mono, Menlo, monospace">empreinte : f922d6f237…</text>
<line x1="210" y1="88" x2="233" y2="88" stroke="#1b2733" stroke-width="1.6"/><path d="M225.8 91.5 L233 88 L225.8 84.5" fill="none" stroke="#1b2733" stroke-width="1.6"/>
<rect x="235" y="42" width="180" height="92" rx="4" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.4"/>
<text x="247" y="62" font-size="12" fill="#1b2733" font-weight="700" text-anchor="start">Bloc 2</text>
<text x="247" y="80" font-size="10.5" fill="#5b646b" text-anchor="start" font-family="DM Mono, Menlo, monospace">précédent : f922d6f237…</text>
<text x="247" y="98" font-size="11.5" fill="#1b2733" text-anchor="start">Bob paie Carol</text>
<text x="247" y="120" font-size="10.5" fill="#284764" font-weight="700" text-anchor="start" font-family="DM Mono, Menlo, monospace">empreinte : ea6535ec2b…</text>
<line x1="415" y1="88" x2="438" y2="88" stroke="#1b2733" stroke-width="1.6"/><path d="M430.8 91.5 L438 88 L430.8 84.5" fill="none" stroke="#1b2733" stroke-width="1.6"/>
<rect x="440" y="42" width="180" height="92" rx="4" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.4"/>
<text x="452" y="62" font-size="12" fill="#1b2733" font-weight="700" text-anchor="start">Bloc 3</text>
<text x="452" y="80" font-size="10.5" fill="#5b646b" text-anchor="start" font-family="DM Mono, Menlo, monospace">précédent : ea6535ec2b…</text>
<text x="452" y="98" font-size="11.5" fill="#1b2733" text-anchor="start">Carol paie Dan</text>
<text x="452" y="120" font-size="10.5" fill="#284764" font-weight="700" text-anchor="start" font-family="DM Mono, Menlo, monospace">empreinte : d77c009bc5…</text>
<text x="30" y="160" font-size="12.5" fill="#8a4a40" font-weight="700" text-anchor="start">Une transaction du bloc 2 modifiée</text>
<rect x="30" y="172" width="180" height="92" rx="4" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.4"/>
<text x="42" y="192" font-size="12" fill="#1b2733" font-weight="700" text-anchor="start">Bloc 1</text>
<text x="42" y="210" font-size="10.5" fill="#5b646b" text-anchor="start" font-family="DM Mono, Menlo, monospace">précédent : 0000000000…</text>
<text x="42" y="228" font-size="11.5" fill="#1b2733" text-anchor="start">Alice paie Bob</text>
<text x="42" y="250" font-size="10.5" fill="#1b2733" font-weight="700" text-anchor="start" font-family="DM Mono, Menlo, monospace">empreinte : f922d6f237…</text>
<line x1="210" y1="218" x2="233" y2="218" stroke="#1b2733" stroke-width="1.6"/><path d="M225.8 221.5 L233 218 L225.8 214.5" fill="none" stroke="#1b2733" stroke-width="1.6"/>
<rect x="235" y="172" width="180" height="92" rx="4" fill="#fbfaf6" stroke="#8a4a40" stroke-width="1.4"/>
<text x="247" y="192" font-size="12" fill="#1b2733" font-weight="700" text-anchor="start">Bloc 2</text>
<text x="247" y="210" font-size="10.5" fill="#5b646b" text-anchor="start" font-family="DM Mono, Menlo, monospace">précédent : f922d6f237…</text>
<text x="247" y="228" font-size="11.5" fill="#8a4a40" font-weight="700" text-anchor="start">Bob paie Eve</text>
<text x="247" y="250" font-size="10.5" fill="#8a4a40" font-weight="700" text-anchor="start" font-family="DM Mono, Menlo, monospace">empreinte : 611fadae11…</text>
<line x1="415" y1="218" x2="438" y2="218" stroke="#8a4a40" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="427" y="210" font-size="13" fill="#8a4a40" font-weight="700" text-anchor="middle">✕</text>
<rect x="440" y="172" width="180" height="92" rx="4" fill="#fbfaf6" stroke="#8a4a40" stroke-width="1.4"/>
<text x="452" y="192" font-size="12" fill="#1b2733" font-weight="700" text-anchor="start">Bloc 3</text>
<text x="452" y="210" font-size="10.5" fill="#8a4a40" font-weight="700" text-anchor="start" font-family="DM Mono, Menlo, monospace">précédent : ea6535ec2b…</text>
<text x="452" y="228" font-size="11.5" fill="#1b2733" text-anchor="start">Carol paie Dan</text>
<text x="452" y="250" font-size="10.5" fill="#1b2733" font-weight="700" text-anchor="start" font-family="DM Mono, Menlo, monospace">empreinte : d77c009bc5…</text>
<text x="30" y="286" font-size="11" fill="#7b8389" text-anchor="start">Empreintes SHA-256 réelles, tronquées. Le bloc 3 contient encore l'ancienne empreinte du bloc 2 : le lien est rompu.</text>
</svg>
