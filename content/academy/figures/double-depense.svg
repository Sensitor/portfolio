<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">La double dépense</title>
<desc id="d">Sans registre commun, Alice envoie la même pièce à Bob et à Carol, qui croient chacun l'avoir reçue. Avec un registre, seule la première transaction inscrite compte, la seconde est refusée.</desc>
<text x="160" y="26" font-size="13" fill="#8a4a40" font-weight="700" text-anchor="middle">Sans registre commun</text>
<text x="480" y="26" font-size="13" fill="#284764" font-weight="700" text-anchor="middle">Avec un registre commun</text>
<line x1="320" y1="40" x2="320" y2="250" stroke="#d9d5cb"/>
<rect x="110" y="50" width="100" height="34" rx="4" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.4"/>
<text x="160" y="72" font-size="13" fill="#1b2733" font-weight="700" text-anchor="middle">Alice</text>
<rect x="430" y="50" width="100" height="34" rx="4" fill="#fbfaf6" stroke="#1b2733" stroke-width="1.4"/>
<text x="480" y="72" font-size="13" fill="#1b2733" font-weight="700" text-anchor="middle">Alice</text>
<rect x="30" y="170" width="100" height="34" rx="4" fill="#fbfaf6" stroke="#8a4a40" stroke-width="1.4"/>
<text x="80" y="192" font-size="13" fill="#1b2733" font-weight="700" text-anchor="middle">Bob</text>
<rect x="190" y="170" width="100" height="34" rx="4" fill="#fbfaf6" stroke="#8a4a40" stroke-width="1.4"/>
<text x="240" y="192" font-size="13" fill="#1b2733" font-weight="700" text-anchor="middle">Carol</text>
<line x1="140" y1="84" x2="90" y2="168" stroke="#8a4a40" stroke-width="1.6"/><path d="M90.7 160.0 L90 168 L96.7 163.6" fill="none" stroke="#8a4a40" stroke-width="1.6"/>
<line x1="180" y1="84" x2="230" y2="168" stroke="#8a4a40" stroke-width="1.6"/><path d="M223.3 163.6 L230 168 L229.3 160.0" fill="none" stroke="#8a4a40" stroke-width="1.6"/>
<text x="70" y="128" font-size="11" fill="#5b646b" text-anchor="end">la pièce n° 7</text>
<text x="214" y="116" font-size="11" fill="#5b646b" text-anchor="start">la même pièce</text>
<text x="160" y="230" font-size="12" fill="#8a4a40" font-weight="700" text-anchor="middle">chacun croit l'avoir reçue</text>
<rect x="380" y="110" width="200" height="66" rx="4" fill="#fbfaf6" stroke="#284764" stroke-width="1.4"/>
<text x="480" y="132" font-size="12" fill="#284764" font-weight="700" text-anchor="middle">Registre</text>
<text x="390" y="152" font-size="11.5" fill="#1b2733" text-anchor="start">1. pièce n° 7 : Alice → Bob</text>
<text x="390" y="168" font-size="11.5" fill="#7b8389" text-anchor="start">2. pièce n° 7 : Alice → Carol</text>
<line x1="390" y1="164" x2="570" y2="164" stroke="#8a4a40" stroke-width="1.4"/>
<line x1="480" y1="84" x2="480" y2="108" stroke="#284764" stroke-width="1.6"/><path d="M476.5 100.8 L480 108 L483.5 100.8" fill="none" stroke="#284764" stroke-width="1.6"/>
<text x="480" y="205" font-size="12" fill="#284764" font-weight="700" text-anchor="middle">seule la première inscrite compte</text>
<text x="480" y="222" font-size="11.5" fill="#5b646b" text-anchor="middle">la seconde est refusée</text>
<text x="30" y="268" font-size="11" fill="#7b8389" text-anchor="start">Copier une pièce numérique est facile : c'est le registre qui décide laquelle compte.</text>
</svg>
