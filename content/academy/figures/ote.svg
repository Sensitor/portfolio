<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Retracements et zone OTE</title>
<desc id="d">Une jambe haussière de 2 380 à 2 420 puis un retour. Les niveaux de retracement de 0, 50, 62, 70,5, 79 et 100 % sont tracés ; la bande entre 62 et 79 % est surlignée comme zone OTE.</desc>
<rect x="100" y="161.3" width="420" height="26.0" fill="#86672f" opacity=".18"/>
<line x1="100" y1="66.6" x2="520" y2="66.6" stroke="#5b646b" stroke-dasharray="" stroke-width="1"/>
<text x="528" y="70.6" font-size="11" fill="#5b646b">0 % · 2420,00</text>
<line x1="100" y1="143.0" x2="520" y2="143.0" stroke="#5b646b" stroke-dasharray="4 3" stroke-width="1"/>
<text x="528" y="147.0" font-size="11" fill="#5b646b">50 % · 2400,00</text>
<line x1="100" y1="161.3" x2="520" y2="161.3" stroke="#86672f" stroke-dasharray="4 3" stroke-width="1"/>
<text x="528" y="165.3" font-size="11" fill="#86672f">62 % · 2395,20</text>
<line x1="100" y1="174.3" x2="520" y2="174.3" stroke="#86672f" stroke-dasharray="4 3" stroke-width="1"/>
<text x="528" y="178.3" font-size="11" fill="#86672f">70,5 % · 2391,80</text>
<line x1="100" y1="187.3" x2="520" y2="187.3" stroke="#86672f" stroke-dasharray="4 3" stroke-width="1"/>
<text x="528" y="191.3" font-size="11" fill="#86672f">79 % · 2388,40</text>
<line x1="100" y1="219.4" x2="520" y2="219.4" stroke="#5b646b" stroke-dasharray="" stroke-width="1"/>
<text x="528" y="223.4" font-size="11" fill="#5b646b">100 % · 2380,00</text>
<polyline points="110,219.4 170,139.2 200,165.9 260,66.6 330,135.4 380,116.2 440,177.4" fill="none" stroke="#284764" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="110" cy="219.4" r="4" fill="#284764"/><circle cx="260" cy="66.6" r="4" fill="#284764"/>
<text x="96" y="223.4" text-anchor="end" font-size="11" fill="#284764">départ</text>
<text x="96" y="70.6" text-anchor="end" font-size="11" fill="#284764">sommet</text>
<text x="160" y="203.3" text-anchor="middle" font-size="11.5" font-weight="700" fill="#86672f">zone OTE</text>
<text x="40" y="282" font-size="11" fill="#7b8389">Les niveaux se mesurent depuis le sommet, en pourcentage de la jambe. La zone de 62 à 79 % est une convention.</text>
</svg>
