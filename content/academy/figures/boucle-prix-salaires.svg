<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">La boucle prix et salaires</title>
<desc id="d">Un cycle en quatre étapes : les prix montent, les salariés demandent des hausses de salaire, les coûts des entreprises augmentent, elles répercutent sur leurs prix ; au centre, les anticipations.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b646b"/></marker></defs>
<circle cx="320" cy="140" r="92" fill="none" stroke="#d9d5cb" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="228.0" y="21.39999999999999" width="184" height="34" rx="3" fill="#fbfaf6" stroke="#8a4a40" stroke-width="1.3"/>
<text x="320.0" y="44.39999999999999" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2733">Les prix montent</text>
<rect x="370.6" y="118.0" width="184" height="44" rx="3" fill="#fbfaf6" stroke="#284764" stroke-width="1.3"/>
<text x="462.6" y="138.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2733">Les salariés demandent</text>
<text x="462.6" y="154.0" text-anchor="middle" font-size="10.8" fill="#5b646b">des hausses de salaire</text>
<rect x="228.0" y="214.60000000000002" width="184" height="44" rx="3" fill="#fbfaf6" stroke="#284764" stroke-width="1.3"/>
<text x="320.0" y="234.60000000000002" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2733">Les coûts des entreprises</text>
<text x="320.0" y="250.60000000000002" text-anchor="middle" font-size="10.8" fill="#5b646b">augmentent</text>
<rect x="85.4" y="118.0" width="184" height="44" rx="3" fill="#fbfaf6" stroke="#284764" stroke-width="1.3"/>
<text x="177.4" y="138.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2733">Les entreprises répercutent</text>
<text x="177.4" y="154.0" text-anchor="middle" font-size="10.8" fill="#5b646b">sur leurs prix</text>
<path d="M366.0 60.3 A92 92 0 0 1 406.5 108.5" fill="none" stroke="#5b646b" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M403.4 178.9 A92 92 0 0 1 358.9 223.4" fill="none" stroke="#5b646b" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M281.1 223.4 A92 92 0 0 1 236.6 178.9" fill="none" stroke="#5b646b" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M233.5 108.5 A92 92 0 0 1 281.1 56.6" fill="none" stroke="#5b646b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="320" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#86672f">Anticipations</text>
<text x="320" y="150" text-anchor="middle" font-size="10.8" fill="#5b646b">ce que chacun croit</text>
<text x="320" y="164" text-anchor="middle" font-size="10.8" fill="#5b646b">de l'inflation à venir</text>
<text x="30" y="282" font-size="11" fill="#7b8389">Une boucle possible, pas automatique : elle s'enclenche surtout quand l'inflation attendue s'écarte durablement de la cible.</text>
</svg>
