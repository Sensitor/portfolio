<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Tendance haussière décrite par ses swings</title>
<desc id="d">Une ligne en zigzag monte de gauche à droite. Chaque sommet, noté S1 à S3, est plus haut que le précédent ; chaque creux, noté C1 à C3, est plus haut que le précédent.</desc>
<g stroke="#e4e1d8"><line x1="40" y1="60" x2="610" y2="60"/><line x1="40" y1="130" x2="610" y2="130"/><line x1="40" y1="200" x2="610" y2="200"/><line x1="40" y1="270" x2="610" y2="270"/></g>
<polyline points="50,250 130,170 180,215 280,120 330,170 430,80 480,125 590,40" fill="none" stroke="#284764" stroke-width="2.4" stroke-linejoin="round"/>
<g fill="#fbfaf6" stroke="#284764" stroke-width="1.6"><circle cx="130" cy="170" r="4.5"/><circle cx="280" cy="120" r="4.5"/><circle cx="430" cy="80" r="4.5"/></g>
<g fill="#4e7461"><circle cx="180" cy="215" r="4.5"/><circle cx="330" cy="170" r="4.5"/><circle cx="480" cy="125" r="4.5"/></g>
<g font-size="13" font-weight="700" fill="#284764" text-anchor="middle"><text x="130" y="156">S1</text><text x="280" y="106">S2</text><text x="430" y="66">S3</text></g>
<g font-size="13" font-weight="700" fill="#3f6553" text-anchor="middle"><text x="180" y="238">C1</text><text x="330" y="193">C2</text><text x="480" y="148">C3</text></g>
<g stroke="#9aa3a8" stroke-dasharray="3 4"><line x1="130" y1="170" x2="280" y2="170"/><line x1="280" y1="120" x2="430" y2="120"/><line x1="180" y1="215" x2="330" y2="215"/><line x1="330" y1="170" x2="480" y2="170"/></g>
<text x="40" y="292" font-size="11" fill="#7b8389">S : sommet de swing · C : creux de swing · S3 &gt; S2 &gt; S1 et C3 &gt; C2 &gt; C1</text>
</svg>
