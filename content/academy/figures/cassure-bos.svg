<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="DM Sans, Helvetica, Arial, sans-serif">
<title id="t">Cassure de structure : mèche ou clôture</title>
<desc id="d">Une tendance haussière. Une bougie dépasse le dernier sommet de swing par sa mèche mais clôture en dessous : pas de cassure. Une bougie suivante clôture au-dessus : cassure de structure.</desc>
