<text x="112" y="90.1" font-size="12" fill="#284764">Dernier sommet de swing</text>
<text x="380" y="51.0" text-anchor="middle" font-size="12" fill="#8a4a40">mèche au-delà,</text>
<text x="380" y="66.0" text-anchor="middle" font-size="12" fill="#8a4a40">clôture en dessous</text>
<text x="380" y="171.4" text-anchor="middle" font-size="11.5" fill="#5b646b">pas de cassure</text>
<text x="504" y="187.1" text-anchor="middle" font-size="12" font-weight="700" fill="#3f6553">clôture au-delà :</text>
<text x="504" y="202.1" text-anchor="middle" font-size="12" font-weight="700" fill="#3f6553">cassure (BOS)</text>
<text x="40" y="285" font-size="11" fill="#7b8389">Convention de ce parcours : une cassure exige une clôture au-delà du niveau. Une mèche seule est une tentative rejetée.</text>
</svg>
