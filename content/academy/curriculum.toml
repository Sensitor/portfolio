# Le programme Sensitor Academy.
#
# Quatre filières, dans l'ordre où l'Academy les présente. Chaque parcours
# appartient à une filière et y est numéroté ; la progression des membres est
# enregistrée par cours et par leçon, jamais par numéro de parcours.
#
# `status = "published"` : le parcours est ouvert et ses cours sont lisibles.
# `status = "planned"`   : annoncé dans le programme, sans contenu lisible.
#                          Affiché comme « en préparation », jamais cliquable.
#
# `require_sources = true` : chaque leçon publiée de la filière doit citer ses
# sources et porter la date de sa dernière relecture (`updated`).

[[track]]
id = "monnaie-bitcoin"
title = "Monnaie et Bitcoin"
short = "Monnaie et Bitcoin"
code = "M"
summary = "Comprendre la monnaie, l'inflation et ce qui a conduit à Bitcoin, puis Bitcoin lui-même : son fonctionnement, sa politique monétaire, ses arguments et ses limites."
require_sources = true

[[track]]
id = "crypto"
title = "Crypto"
short = "Crypto"
code = "C"
summary = "Les bases techniques pour utiliser les cryptomonnaies en sécurité, puis l'analyse des protocoles, des tokens et des données on-chain."
require_sources = true

[[track]]
id = "investissement"
title = "Investissement"
short = "Investissement"
code = "I"
summary = "Construire et évaluer une stratégie d'investissement crypto cohérente avec son horizon et sa tolérance au risque."
require_sources = true

[[track]]
id = "trading"
title = "Trading"
short = "Trading"
code = "T"
summary = "Price action, liquidité, zones, gestion du risque, psychologie et backtesting : la méthode du trader, de la première bougie au processus discipliné."

[[path]]
id = "monnaie-inflation"
track = "monnaie-bitcoin"
number = 1
title = "Monnaie, inflation et théorie monétaire"
summary = "Ce qu'est la monnaie, comment elle est créée, ce qu'est l'inflation et ce qui la provoque, la différence entre rendement nominal et réel, la dette et la politique monétaire, et les grandes écoles de pensée qui en débattent."
status = "published"
courses = ["la-monnaie", "l-inflation"]
topics = ["La monnaie et sa création", "L'inflation et ses causes", "Rendement nominal et réel", "Écoles de pensée"]

[[path]]
id = "bitcoin"
track = "monnaie-bitcoin"
number = 2
title = "Bitcoin en profondeur"
summary = "Les origines et le fonctionnement de Bitcoin, sa politique monétaire, les arguments qui en font une réserve de valeur possible et leurs objections, son rapport à l'inflation, ses cycles et ses indicateurs."
