# Les informations des pages légales (mentions légales, conditions d'utilisation,
# confidentialité). Un champ vide s'affiche « à compléter » sur la page, et la
# page porte un bandeau tant qu'il en reste un ou que `relu` vaut false.
# Pour l'ouverture aux membres, l'éditeur est « Sensitor », sans société ; les
# informations d'une société (forme, siège, immatriculation) s'ajouteront aux
# textes le jour où il y en aura une.

relu = false                 # true une fois les trois textes relus (par un juriste, idéalement)
mise_a_jour = "2026-11-04"   # date de la version des textes

[editeur]
raison_sociale = "Sensitor"
contact = "l'équipe Sensitor, depuis la Communauté (thème « Questions sur Sensitor »)"
contact_donnees = "l'équipe Sensitor, depuis la Communauté (thème « Questions sur Sensitor »)"

[hebergement]
application = "Streamlit Community Cloud (Snowflake Inc., États-Unis)"
base_de_donnees = "Supabase (Supabase Inc.)"
emails = "Brevo (Sendinblue SAS, France)"
newsletter = "Brevo (Sendinblue SAS, France)"
site = "GitHub Pages (GitHub Inc., États-Unis)"
