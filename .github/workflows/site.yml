# Publishes the public site (scripts/build_site.py) to GitHub Pages on every
# push to main, and on demand from the Actions tab.
#
# One-time setup, in the repository's settings:
#   Settings > Pages > Build and deployment > Source: « GitHub Actions ».
# The member area's address is in content/site.toml (app_url): change it there.
# The site's own address is the GitHub Pages one, unless the repository variable
# SENSITOR_SITE_URL names a domain. The build needs Python only.
name: Public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          SITE_URL: ${{ vars.SENSITOR_SITE_URL || steps.pages.outputs.base_url }}
        run: |
          python -m sensitor.academy.validate
          python scripts/build_site.py --base-url "$SITE_URL" --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
